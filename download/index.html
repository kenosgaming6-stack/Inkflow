/* StallBook v3. Rule for every screen: look at the top, read the middle, touch the bottom. Give and Collect never leave the list. */
:root{
  --safe-b:max(0px,calc(env(safe-area-inset-bottom,0px) - 22px));
  --paper:#FFFFFF;--page:#FFFFFF;--rule:#CBDAEE;--margin:#E0545A;--ink:#24307A;--text:#1A1D26;--muted:#555B69;--faint:#6F7585;
  --owe:#BE2329;--owe-bg:#FDECEC;--paid:#17703F;--paid-bg:#E3F3E9;--warn:#7A4E00;--warn-bg:#FFEFC7;--held:#B76E00;--bar:#24307A;
  --on-btn:#FFFFFF;--key:#ECEFF5;--key-text:#1A1D26;--line:#DFE3EC;--sheet:#FFFFFF;--shade:rgba(5,8,18,.5);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
/* Everything is sized in rem. --s is set by the script from the screen (1 on an iPhone 12), so the whole app grows on tablets
   and computers and shrinks a little on small phones. The app always fills the screen top to bottom. */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;font-size:calc(16px * var(--s, 1));background:#FFFFFF}
#shell{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:35rem;margin:0 auto;background:var(--paper);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
html.kb #shell{bottom:auto;top:var(--app-top,0px);height:var(--app-h)}
#app{height:100%;display:flex;flex-direction:column;position:relative}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:60;pointer-events:none}
button,a,.row,.tab,.chip,.key,.face{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kb .tabs{display:none}
.kb .dock{padding-bottom:.5rem}
.steps3{margin:0;padding:0 0 0 1.375rem;display:flex;flex-direction:column;gap:.375rem;color:var(--text)}
.steps3 b{color:var(--ink)}
.ver{font-size:.8125rem;color:var(--faint);text-align:center;padding:.25rem .75rem 1rem}
#layer{position:absolute;inset:0;pointer-events:none;z-index:30}
#layer>*{pointer-events:auto}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:.1875rem solid var(--ink);outline-offset:.125rem}
.i{width:1.375rem;height:1.375rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top: look */
.top{flex:none;padding:.5rem .75rem .625rem;display:flex;flex-direction:column;gap:.5rem}
.hrow{display:flex;align-items:center;gap:.5rem;min-width:0}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem .75rem;border-radius:62.4375rem;background:var(--key);color:var(--ink);font-weight:700;font-size:.9375rem;white-space:nowrap}
.ib{width:2.75rem;height:2.75rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.ib.faint{color:var(--faint)}
.dot{position:absolute;top:.5rem;right:.5rem;width:.625rem;height:.625rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 .125rem var(--paper)}
.title{flex:1;min-width:0}
.title b{display:block;font-size:1.25rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:.8125rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;font-size:1.25rem;font-weight:700;color:var(--ink)}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .n{font-size:3.25rem;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hero .n.owe{color:var(--owe)}.hero .n.ok{color:var(--paid)}
.hero .l{font-size:.9375rem;color:var(--muted);margin-top:.125rem}
.hero .s{font-size:.8125rem;color:var(--faint);margin-top:.125rem}
.split{display:flex;justify-content:center;flex-wrap:wrap;gap:.25rem .875rem;font-size:.875rem;color:var(--muted)}
.split b{color:var(--text)}.split .w b{color:var(--warn)}.split .g b{color:var(--paid)}
.pulse{animation:tick .4s ease-out}
@keyframes tick{0%{transform:scale(1.2)}100%{transform:scale(1)}}
.chips{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;margin:0 -.75rem;padding:0 .75rem}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;padding:.5rem .875rem;border-radius:62.4375rem;border:.09375rem solid var(--line);font-size:.9375rem;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.chip.dash{border-style:dashed}

/* middle: read */
.mid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none}
.mid::-webkit-scrollbar{display:none}
.mid.book{background:linear-gradient(to right,transparent 1.6875rem,var(--margin) 1.6875rem,var(--margin) 1.8125rem,transparent 1.8125rem) var(--paper);border-top:.09375rem solid var(--rule)}
.mid.plain{border-top:.09375rem solid var(--line)}
.mid.center{padding:.75rem;gap:.625rem}
.mid.center::before{content:"";flex:1 1 auto}
.mid.run{background:var(--page);padding:.75rem}
.mid.run::before,.mid.run::after{content:"";flex:1 1 auto}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.enter{animation:enter .16s ease-out}
.ptabs{margin-top:.625rem;display:flex;align-items:center;gap:.375rem}
.ptabs .chips{flex:1;min-width:0;margin-right:0;padding-right:0}
.ptabs > .chip{flex:none}
.mid.slide-l{animation:slidel .2s ease-out}
.mid.slide-r{animation:slider .2s ease-out}
@keyframes slidel{from{opacity:.3;transform:translateX(2.25rem)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:.3;transform:translateX(-2.25rem)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(.375rem)}to{opacity:1;transform:none}}
.lines{margin-top:auto}
.lines.down{margin-top:0}
.row{display:flex;align-items:center;gap:.625rem;width:100%;min-height:3.875rem;padding:.5rem .75rem .5rem 2.5rem;border-bottom:.09375rem solid var(--rule);text-align:left;position:relative}
.row .who{flex:1;min-width:0;text-align:left}
.row.wait{background:var(--warn-bg)}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
.row.gone .who,.row.gone .amt{text-decoration:line-through;color:var(--faint)}
.name{font-size:1.125rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.8125rem;color:var(--faint);margin-top:.0625rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:1rem;color:var(--text)}
.amt{font-size:1.125rem;font-weight:700;color:var(--owe);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.amt.ink{color:var(--ink)}.amt.ok{color:var(--paid)}.amt.faint{color:var(--faint);font-weight:400;font-size:.9375rem}
.amt small{display:block;font-size:.75rem;font-weight:400;color:var(--faint)}
.d{flex:none;width:2.875rem;font-size:.8125rem;color:var(--faint)}
.mk{position:absolute;left:.375rem;top:50%;transform:translateY(-50%);width:1.125rem;text-align:center;font-weight:700;font-size:1rem}
.mk.ok{color:var(--paid)}.mk.w{color:var(--warn)}.mk.r{color:var(--owe)}
.takebtn{flex:none;min-height:2.875rem;padding:0 .875rem;border-radius:.75rem;background:var(--owe);color:var(--on-btn);font-weight:700;font-size:.9375rem;display:flex;align-items:center;gap:.25rem}
.sect{display:flex;align-items:center;gap:.5rem;min-height:2.875rem;padding:.5rem .75rem .375rem 2.5rem;font-size:.875rem;font-weight:700;color:var(--muted);border-bottom:.09375rem solid var(--rule)}
.sect span{flex:1}
.sect.w{color:var(--warn)}
.sect .mini{padding:.4375rem .75rem;border-radius:.5625rem;background:var(--key);color:var(--ink);font-size:.875rem}
.endrow{display:flex;align-items:center;gap:.5rem;width:100%;min-height:3.25rem;padding:.625rem .75rem .625rem 2.5rem;font-size:.9375rem;font-weight:700;color:var(--muted);text-align:left}
.empty{padding:1.75rem 1.125rem 1.5rem 2.5rem;color:var(--muted)}
.empty h2{margin:0 0 .25rem;font-size:1.25rem;color:var(--ink)}
.empty p{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.125rem .4375rem;border-radius:.375rem;background:var(--key);color:var(--ink);white-space:nowrap;vertical-align:.0625rem}
.tag.ok{background:var(--paid-bg);color:var(--paid)}.tag.w{background:var(--warn-bg);color:var(--warn)}.tag.r{background:var(--owe-bg);color:var(--owe)}
.tags{display:flex;flex-wrap:wrap;gap:.3125rem;justify-content:center}
.tags.l{justify-content:flex-start}
.owes{text-align:center;display:flex;flex-direction:column;align-items:center}
.owes small{font-size:.875rem;color:var(--muted)}
.owes b{font-size:2.75rem;line-height:1.05;color:var(--owe);font-variant-numeric:tabular-nums}
.owes b.ok{color:var(--paid);font-size:1.875rem}

.strip{display:flex;align-items:center;gap:.5rem;width:100%;padding:.625rem .75rem;border-radius:.75rem;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.9375rem;text-align:left}

.step{display:flex;align-items:center;justify-content:center;gap:1.125rem}

.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:1.375rem 1.375rem 0 0;padding:.5rem .875rem calc(.875rem + var(--safe-b));display:flex;flex-direction:column;gap:.75rem;animation:up .2s ease-out;scrollbar-width:none}

.grab{display:block;width:2.625rem;height:.3125rem;border-radius:.1875rem;background:var(--line);margin:.125rem auto 0}

.sheet .center{text-align:center}
.small{font-size:.8125rem;color:var(--faint)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(2.5rem);opacity:.6}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{position:absolute;left:.75rem;right:.75rem;bottom:calc(.75rem + var(--safe-b));display:flex;align-items:center;gap:.375rem;padding:.5rem .5rem .5rem .875rem;border-radius:.875rem;background:var(--text);color:var(--paper);font-size:.9375rem;box-shadow:0 .5rem 1.375rem rgba(0,0,0,.25);animation:pop .17s ease-out;z-index:40}
.toast span{flex:1;padding:.25rem 0}

.toast button,.toast a{pointer-events:auto}

.toast button,.toast a{flex:none;font-weight:700;padding:.5625rem .75rem;border-radius:.625rem;background:var(--paper);color:var(--text);font-size:.875rem}
.field{display:flex;flex-direction:column;gap:.3125rem}
.field label{font-size:.875rem;color:var(--muted)}
.field input{width:100%;padding:.6875rem .75rem;border-radius:.75rem;border:.09375rem solid var(--line);background:var(--paper);font-size:1.125rem;min-height:3.25rem;outline:none}

.msgprev{padding:.75rem .875rem;border-radius:.875rem;background:var(--key);font-size:.9375rem;line-height:1.45;color:var(--text)}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.datebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.875rem;border-radius:.875rem;border:.09375rem solid var(--line);color:var(--ink)}

.datebtn.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.datebtn.on small{color:var(--on-btn);opacity:.8}
.cs-amt{font-size:2.875rem;font-weight:700;color:var(--paid);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}

.stamp{align-self:center;margin:.25rem 0;border:.25rem solid var(--paid);color:var(--paid);font-size:1.875rem;font-weight:700;padding:.125rem 1.125rem;border-radius:.625rem;transform:rotate(-6deg);letter-spacing:.1875rem;animation:slam .38s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-16deg);opacity:0}60%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.coin{position:absolute;z-index:45;width:1.75rem;height:1.75rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E2A814 60%,#B47F00);color:#6E4A00;font-weight:700;font-size:.9375rem;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:coinfly 1.1s cubic-bezier(.2,.7,.3,1) both}
@keyframes coinfly{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.celebrate{position:absolute;inset:0;z-index:44;background:var(--shade);display:flex;align-items:center;justify-content:center;animation:fade .2s ease-out}

.card{background:var(--paper);border:.09375rem solid var(--line);border-radius:1.25rem;padding:1.125rem 1rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.375rem}

.set{display:flex;align-items:center;justify-content:space-between;gap:.625rem;padding:.75rem;border-bottom:.09375rem solid var(--line)}
.setbox{display:flex;flex-direction:column;gap:.75rem;padding:.75rem}

.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4375rem}
.key:active,.btn:active,.row:active,.sq:active,.chip:active,.face:active,.note:active,.tab:active,.datebtn:active,.takebtn:active{transform:scale(.97)}
/* short screens (under 700 rem-pixels tall once scaled): tighter keys and buttons */
:where(html.short) .kp.pay .key,:where(html.short) .kp .key{min-height:2.75rem;font-size:1.375rem}:where(html.short) .note{min-height:2.25rem}:where(html.short) .disp .v{font-size:2.125rem}:where(html.short) .disp{padding:.5rem .75rem}
:where(html.short) .hero .n{font-size:2.75rem}:where(html.short) .btn{min-height:3.25rem}:where(html.short) .btn.tall{min-height:3.625rem}:where(html.short) .sq{min-height:3.25rem}:where(html.short) .find{min-height:3.25rem}:where(html.short) .dock{gap:.375rem}
/* v3 */
.stock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.25rem .875rem;align-items:center;padding:.625rem .75rem;border-radius:1.125rem;background:var(--key)}

function carStats(cid) {

  let credit = 0, cashAmt = 0, cashBags = 0, carAdj = 0, countAdj = 0; const stock = [];
  for (const e of S.entries) {

    if (e.type === 'give') { const I = it(e.itemId); if (givenAt(e)) { I.off += e.bags; credit += e.amount; } else I.wait += e.bags; }
    else if (e.type === 'cash') { it(e.itemId).cash += e.bags; cashAmt += e.amount; cashBags += e.bags; }
    else if (e.type === 'back') { const g = c.byId.get(e.ref); it(g ? g.itemId : null).back += e.bags; credit -= e.amount; }

    credit, collected, out, costs, stock, people: [...ids], profitNow: r2(cashAmt + collected - costs), profitAll: r2(cashAmt + credit - costs)};
}

/* ---------- receipts by SMS, sent by themselves (Arkesel) ----------

/* ===== Count check: look at the stack, say how many are really left =====

function checkSheet() {
  const car = givingCar(); if (!car) return noCarSheet();

  const rows = V.cc.rows; const one = rows.length === 1;

  const msg = short ? `<span style="color:var(--warn)">${bagsTxt(short)} will show with no name.</span>` : more ? `${bagsTxt(more)} more than the book says.` : '';
  const stepper = (r, i) => one

  const total = sum(rows, r => r.n), same = !short && !more;

function saveCheck() {
  const car = givingCar(); const cc = V.cc; if (!car || !cc) return closeSheet();
  const rows = []; let short = 0, more = 0, flash = null;
  cc.rows.forEach(r => {
    const I = carStats(car.id).items.find(i => i.id === r.id); if (!I) return;
    const diff = Math.max(0, I.free) - r.n; rows.push({itemId: r.id, was: Math.max(0, I.free), now: r.n});
    if (diff > 0) { const g = add({type: 'gap', carId: car.id, itemId: r.id, bags: diff, price: I.price, loc: locById(S.lastLoc) ? S.lastLoc : ''}); short += diff; flash = g.id; }
    else if (diff < 0) {
      let found = -diff; more += found;
      gapsOn(car.id).filter(g => g.itemId === r.id).sort((a, b) => cmp(b.date, a.date)).forEach(g => { if (found <= 0) return; const take = Math.min(g.bags, found); shrinkGap(g, take); found -= take; });
      if (found > 0) add({type: 'stock', carId: car.id, itemId: r.id, bags: found, reason: 'count'});
    }
  });
  add({type: 'check', carId: car.id, rows, loc: locById(S.lastLoc) ? S.lastLoc : ''});
  car.checkedAt = nowIso(); commit(); V.cc = null; V.ask = false; V.flash = flash;

}

  const bySev = (a, b) => b.st.sev - a.st.sev || b.L.bal - a.L.bal;
  const now = all.filter(x => x.st.sev >= 3).sort(bySev);

  const later = all.filter(x => x.st.sev < 3 && x.st.k !== 'promised').sort((a, b) => cmp(a.st.due || '', b.st.due || ''));
  return {all, now, prom, later, order: [...now, ...prom, ...later]};
}

function remindList(ids) {

/* money pad over the list: the calculator lives where money is typed */
const paySum = () => r2(sum([...V.pay.terms, V.pay.cur], x => Number(x) || 0));
function payPreview(pid, amt, loadId) {
  const open = ledger(pid).loads.filter(L => L.left > 0.001); const first = open.find(L => L.id === loadId);
  const order = (first ? [first] : []).concat(open.filter(L => L !== first)); let r = amt; const outp = [];
  for (const L of order) { if (r <= 0.001) break; const k = Math.min(L.left, r); r -= k; outp.push({L, k, cleared: k >= L.left - 0.001}); }
  return outp;
}
function openPay(pid, o) { V.pay = Object.assign({pid, terms: [], cur: '', method: 'cash', err: '', loadId: null, ctx: 'collect', over: ''}, o || {}); paySheet(); }
function nextPayId(pid) { const ord = collectLists().order.map(x => x.p.id); const i = ord.indexOf(pid); return ord.slice(i + 1).find(id => id !== pid) || null; }
function paySheet() {
  const P = V.pay; const p = person(P.pid); const L = ledger(p.id); const a = paySum(); const left = r2(L.bal - a);
  const tape = [...P.terms, P.cur].filter(Boolean);
  const over = a > Math.max(0, L.bal) + 0.001;
  const pv = payPreview(p.id, a, P.loadId);
  const next = P.ctx === 'collect' ? nextPayId(p.id) : null;
  sheet(`<div class="hrow"><span class="av">${esc(initials(p.name))}</span><div class="title"><b>${esc(p.name)}</b><small>${L.bal > 0.001 ? 'Owes ' + money(L.bal) : 'Owes nothing'}${p.loc ? ' · ' + esc(locTxt(p.loc)) : ''}</small></div>${L.bal > 0.001 ? `<button class="lnk" data-act="promise" data-id="${p.id}">Not today</button>` : ''}<button class="lnk" data-act="person" data-id="${p.id}">History ›</button></div>
    <div class="disp"><div class="tape">${tape.length > 1 ? tape.map(x => fmt(Number(x))).join(' + ') : '&nbsp;'}</div><div class="v ${a ? 'g' : ''}">${money(a)}</div><div class="s">${!a ? 'Tap the notes as she counts' : over ? money(a - Math.max(0, L.bal)) + ' more than she owes' : left > 0.001 ? money(left) + ' left after this' : 'All paid'}</div></div>
    ${over ? `<div class="over">What about the extra ${money(a - Math.max(0, L.bal))}?<div class="bar"><button class="chip ${P.over === 'credit' ? 'on' : ''}" data-act="pover" data-v="credit">Keep as credit</button><button class="chip ${P.over === 'change' ? 'on' : ''}" data-act="pover" data-v="change">Gave change</button></div></div>`
      : `<p class="clears">${a ? pv.map(x => x.cleared ? `Clears <b>${dmy(x.L.date)}</b>` : `${money(x.k)} off ${dmy(x.L.date)}`).join(', ') : '&nbsp;'}</p>`}
    <div class="seg mini2"><button class="${P.method === 'cash' ? 'on' : ''}" data-act="method" data-m="cash">Cash</button><button class="${P.method === 'momo' ? 'on' : ''}" data-act="method" data-m="momo">MoMo</button></div>
    <div class="notes">${NOTES.map(n => `<button class="note" data-act="note" data-n="${n}">${n}</button>`).join('')}</div>${keypad('pay')}
    ${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
    <div class="bar">${L.bal > 0.001 ? `<button class="btn ghost" data-act="payall">All ${money(L.bal)}</button>` : `<button class="btn ghost" data-act="sheetclose">Close</button>`}<button class="btn take" data-act="paydone">Done</button>${next ? `<button class="btn ghost" style="flex:.7" data-act="paynext" aria-label="Save and open the next customer">Next ›</button>` : ''}</div>`, 'pay');
  V.sheetKind = 'pay';
}
function payKey(k) {
  const P = V.pay;
  if (k === 'del') { if (P.cur) P.cur = P.cur.slice(0, -1); else P.terms.pop(); }
  else if (k === '+') { if (P.cur) { P.terms.push(P.cur); P.cur = ''; } }
  else { const n = (P.cur + k).replace(/^0+(?=\d)/, ''); if (n.length <= 7) P.cur = n; }
  P.err = ''; P.over = ''; paySheet();
}
/* saves the payment; returns false when something is missing */
function savePay() {
  const P = V.pay; const a = paySum(); const p = person(P.pid); const L = ledger(p.id);
  if (!a) { P.err = 'Type the money she gave first.'; paySheet(); return false; }
  const over = a > Math.max(0, L.bal) + 0.001;
  if (over && !P.over) { P.err = 'Choose what happens to the extra.'; paySheet(); return false; }
  const amount = over && P.over === 'change' ? Math.max(0, L.bal) : a;
  if (!amount) { P.err = 'She owes nothing. Keep it as credit, or give it back.'; paySheet(); return false; }
  const outBefore = new Map(S.cars.filter(c => c.phase === 'out').map(c => [c.id, carStats(c.id).out]));
  const e = add(Object.assign({type: 'pay', pid: p.id, amount, method: P.method, loadId: P.loadId || null, carId: null, rcpt: !p.phone}, over && P.over === 'change' ? {change: r2(a - amount)} : {}));
  const bal = ledger(p.id).bal;
  sfx('cash'); buzz(25); if (bal <= 0.001) setTimeout(() => { sfx('thud'); coins(14); }, 250);
  const done = S.cars.find(c => c.phase === 'out' && outBefore.get(c.id) > 0.001 && carStats(c.id).out <= 0.001);
  if (done) setTimeout(() => celebrate(done), 900);
  V.flashPay = {pid: p.id, amt: amount, t: Date.now()};
  V.lastPay = {e, p, amount, bal};
  return true;
}
function payToast() { const {e, p, amount, bal} = V.lastPay; toast(`${p.name} paid ${money(amount)}`, [p.phone && !smsReady() ? {label: 'Receipt', href: sendHref(p, msgPay(p, amount, bal))} : null]); }

function wizBack() {

function closeCar() {
  const car = carById(V.cl.cid); const st = carStats(car.id); const left = Math.max(0, st.free); const ids = []; const ch = V.cl.choice;
  if (left > 0) {
    const parts = st.items.map(I => ({itemId: I.id, price: I.price, bags: Math.max(0, I.free)}));
    const s = sum(parts, x => x.bags); if (s !== left) parts[0].bags = Math.max(0, parts[0].bags + (left - s));
    parts.forEach(pt => { if (!pt.bags) return; const e = ch === 'cash' ? add({type: 'cash', pid: null, carId: car.id, itemId: pt.itemId, bags: pt.bags, price: pt.price, amount: r2(pt.bags * pt.price)}) : add({type: 'stock', carId: car.id, itemId: pt.itemId, bags: -pt.bags, reason: ch}); ids.push(e.id); });
    if (ch === 'next') S.carry = (Number(S.carry) || 0) + left;
  }
  car.phase = 'out'; car.closedAt = nowIso(); car.closeIds = ids; car.closeCarry = ch === 'next' ? left : 0; commit();

      const d = JSON.parse(r.result); const data = d.stallbook || d;
      if (!data || !Array.isArray(data.people) || !Array.isArray(data.entries)) throw new Error('bad');
      V.restoreData = data.v >= 2 ? normalize(data) : normalize(fromV1(data));
      const n = V.restoreData.people.length;
      sheet(`<h3>Restore this backup?</h3><p>${n} ${n === 1 ? 'name' : 'names'}${d.savedAt ? ', saved ' + dmy(d.savedAt) : ''}. It replaces the book on this phone.</p><div class="bar"><button class="btn ghost" data-act="sheetclose">Cancel</button><button class="btn ink" data-act="restoreyes">Restore</button></div>`);
    } catch (x) { sheet(`<h3>That is not a StallBook backup</h3><p>Pick the file named StallBook-backup.</p><button class="btn ghost" data-act="sheetclose">Close</button>`); }
  };
  r.readAsText(file); e.target.value = '';
}
function doBackup() {
  const d = new Date(); const name = `StallBook-backup-${dayKey(d)}.json`;
  const json = JSON.stringify({stallbook: S, savedAt: d.toISOString(), version: 3});
  const done = () => { S.lastBackup = nowIso(); save(); render(); toast('Backup ready. Keep it in WhatsApp.'); };
  try { const file = new File([json], name, {type: 'application/json'}); if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: 'StallBook backup', text: 'StallBook backup, ' + dmy(d)}).then(done).catch(() => {}); return; } } catch (x) {}
  try { const url = URL.createObjectURL(new Blob([json], {type: 'application/json'})); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); done(); } catch (x) { toast('Backup did not work on this phone'); }
}
function backupSheet() {
  const need = needsBackup();
  sheet(`<i class="grab"></i><h3>${need ? 'Back up your book' : 'Book is backed up ✓'}</h3><p>${S.lastBackup ? 'Last backup: ' + dmy(S.lastBackup) + '.' : 'No backup yet.'} ${need ? 'Some changes are only on this phone.' : ''} Send the file to your own WhatsApp, or save it in Files. If the phone is lost, it brings everything back.</p>
    <button class="btn ink tall" data-act="backup">${svg('cloud')} Back up (WhatsApp or Files)</button><button class="btn ghost" data-act="sheetclose">Close</button>`);
}

/* queues: receipts after a rush, reminders before collecting */
function queueStep() {
  const Q = V.queue; if (!Q) return;
  if (Q.i >= Q.ids.length) { V.queue = null; sheet(`<h3>${Q.kind === 'rcpt' ? 'Receipts done ✓' : 'Reminders done ✓'}</h3>${Q.none && Q.none.length ? `<p>No number: ${Q.none.map(esc).join(', ')}</p>` : ''}<button class="btn ink" data-act="queuedone">Done</button>`); return; }
  const p = person(Q.ids[Q.i]); let body, info;
  if (Q.kind === 'rcpt') { const es = pendingReceipts(Q.carId).get(p.id) || []; body = receiptMsg(p, es); info = bagsTxt(sum(es, e => e.bags)); }
  else { body = msgRemind(p); info = `Owes ${money(ledger(p.id).bal)}`; }
  const href = sendHref(p, body);
  sheet(`<p class="small center">${Q.i + 1} of ${Q.ids.length}</p><h3 class="center">${esc(p.name)}</h3><p class="center">${info}</p>
    <a class="btn ink tall" href="${esc(href)}" ${linkAttrs(href)} data-act="qsent" data-id="${p.id}">${svg('msg')} Send to ${esc(shortName(p.name))}</a>
    <div class="bar"><button class="btn ghost" data-act="qstop">Stop</button><button class="btn ghost" data-act="qskip">Skip</button></div>`);
}

    const e = add({type: 'cash', pid: null, carId: car.id, itemId: it.id, bags: 1, price: it.price, amount: it.price, loc: locById(S.lastLoc) ? S.lastLoc : ''}); sfx('coin'); buzz(15); V.pulse = true; render();
    return; }

  case 'essave': { const e = byId(V.es.id); const n = fixGive(V.es.id, {bags: V.es.n}); closeSheet(); V.flash = n.id; render(); return toast(`${bagsNum(e.bags)} → ${bagsNum(V.es.n)}`, []); }
  case 'eswho': return nameSheet(V.es.id);
  case 'esloc': { const e = byId(V.es.id); return locSheet({mode: 'entry', id: e.id, sel: e.loc}); }
  case 'nspick': { const e = byId(V.ns.id); let pid = d.id; if (!pid) { const p = {id: uid(), name: d.name.trim(), phone: '', loc: e.loc || '', note: '', created: nowIso()}; S.people.push(p); pid = p.id; }

  case 'handall': { const car = carById(d.id) || givingCar(); const gs = heldOn(car.id).filter(e => d.loc === undefined || d.loc === '*' || locKey(e) === d.loc); if (!gs.length) return; const hs = handOver(gs, ''); sfx('bag');

  case 'bksave': { const e = byId(V.bk.id); add({type: 'back', pid: e.pid, carId: e.carId, ref: e.id, bags: V.bk.n, price: e.price, amount: r2(V.bk.n * e.price)}); closeSheet(); render(); return toast(`${bagsTxt(V.bk.n)} brought back, ${money(V.bk.n * e.price)} off`); }

  case 'cldo': return closeCar();
  case 'reopen': { const car = carById(d.id); const open = givingCar(); if (open && open.id !== car.id) { closeSheet(); return toast('Close the open delivery first'); }
    (car.closeIds || []).forEach(id => undoEntry(id)); if (car.closeCarry) S.carry = Math.max(0, (Number(S.carry) || 0) - car.closeCarry);
    car.closeIds = []; car.closeCarry = 0; car.phase = 'giving'; commit(); closeSheet(); toast(`${carName(car)} is open again`); return toRoot('give'); }
  case 'price': { const car = carById(d.id); closeSheet(); if (car.items.length > 1) return sheet(`<i class="grab"></i><h3>Which price?</h3>${car.items.map(i => `<button class="btn ghost" data-act="priceitem" data-id="${car.id}" data-i="${i.id}">${esc(i.name)} · ${money(i.price)}</button>`).join('')}`); return act('priceitem', {id: car.id, i: car.items[0].id}); }
  case 'priceitem': { const car = carById(d.id); const it = car.items.find(i => i.id === d.i); closeSheet();
    return openNum({title: `Price for one ${it.name ? it.name.toLowerCase() + ' ' : ''}${unit()}`, sub: 'From now on, for this delivery', mode: 'money', onSave: n => { if (!(n > 0)) return 'Type the price.'; it.price = n; S.settings.price = n; commit(); }}); }
  case 'label': closeSheet(); return labelSheet(d.id);
  case 'lbchip': { const i = document.getElementById('lb_in'); if (i) i.value = d.l; return; }
  case 'lbsave': { const car = carById(d.id); car.label = (document.getElementById('lb_in').value || '').trim(); commit(); closeSheet(); return render(); }
  case 'wlabel': V.w.label = d.l; return render();
  case 'count': { const car = givingCar(); if (!car) return noCarSheet(); V.cc = null; return checkSheet(); }
  case 'ccminus': { const r = V.cc.rows[+d.i]; if (r.n > 0) r.n -= 1; return checkSheet(); }
  case 'ccplus': { V.cc.rows[+d.i].n += 1; return checkSheet(); }
  case 'ccnum': { const i = +d.i; closeSheet(); return openNum({title: `How many ${unit()}s are left?`, sub: V.cc.rows[i].name || 'Count them, not the held ones', mode: 'count', onSave: n => { V.cc.rows[i].n = n; setTimeout(checkSheet, 30); }}); }
  case 'ccsave': return saveCheck();
  case 'gap': V.gn = null; return gapSheet(d.id);
  case 'gnminus': if (V.gn.n > 1) V.gn.n -= 1; return gapSheet(V.gn.id);
  case 'gnplus': { const g = byId(V.gn.id); if (V.gn.n < g.bags) V.gn.n += 1; return gapSheet(V.gn.id); }
  case 'gnpick': return gapGive(d.id || null, d.name || '');
  case 'gnlost': { const g = byId(V.gn.id); const n = V.gn.n; gapLose(g, n); commit(); V.gn = null; closeSheet(); sfx('thud'); render(); return toast(`${bagsTxt(n)} lost`); }
  case 'gaplostall': { gapsOn(d.id).forEach(g => gapLose(g, g.bags)); commit(); if (V.sheetKind === 'close') { closeCarSheet(); render(); return; } closeSheet(); return render(); }
  case 'addcost': { const car = carById(d.id); closeSheet(); return openNum({title: 'Add a cost', sub: carName(car), mode: 'money', chips: ['Load', 'Transport', 'Loading', 'Market toll', 'Other'], chip: (car.costs || []).length ? 'Transport' : 'Load', onSave: (n, chip) => { if (!(n > 0)) return 'Type the amount.'; car.costs = car.costs || []; car.costs.push({id: uid(), name: chip || 'Other', amount: n}); commit(); }}); }
  case 'wback': return wizBack();
  case 'wsame': Object.assign(V.w, {same: true, s: 1, sub: 0, items: [{id: uid(), name: '', count: 0, price: 0}], si: 0, tmp: S.carry ? String(S.carry) : '', err: ''}); return render();
  case 'wdiff': Object.assign(V.w, {same: false, s: 1, sub: 0, items: [{id: uid(), name: '', count: 0, price: 0}], si: 0, tmp: '', err: ''}); return render();
  case 'wname': V.w.items[V.w.si].name = d.n; V.w.sub = 1; V.w.tmp = ''; return render();
  case 'wmore': V.w.items.push({id: uid(), name: '', count: 0, price: 0}); V.w.si = V.w.items.length - 1; V.w.sub = 0; V.w.tmp = ''; return render();
  case 'wdone': V.w.s = 2; V.w.tmp = ''; return render();
  case 'wlast': V.w.items[0].price = Number(S.settings.price) || 0; V.w.s = 2; V.w.tmp = ''; return render();
  case 'wnext': { const W = V.w; const n = +W.tmp || 0; const it = W.items[W.si]; W.err = '';
    if ((W.sub === 0 && W.same) || (W.sub === 1 && !W.same)) { if (!(n > 0)) { W.err = 'Type how many.'; return render(); } it.count = n; W.sub = W.same ? 1 : 2; W.tmp = ''; return render(); }
    if (!(n > 0)) { W.err = 'Type the price.'; return render(); }
    it.price = n; W.tmp = ''; if (W.same) W.s = 2; else W.sub = 3; return render(); }
  case 'wfinish': { const W = V.w; const cost = d.skip ? 0 : +W.tmp || 0;
    const car = {id: uid(), date: nowIso(), label: (W.label || '').trim(), items: W.items.map(i => ({id: i.id, name: W.same ? '' : i.name, count: i.count, price: i.price})), costs: cost ? [{id: uid(), name: 'Load', amount: cost}] : [], phase: 'giving'};
    S.cars.push(car); S.carry = 0; S.settings.price = car.items[0].price; commit(); V.w = null; return toRoot('give'); }

  /* settings, backup */
  case 'setseg': S.settings[d.k] = d.k === 'checkMins' ? Number(d.v) : d.v; commit(); return render();
  case 'smstoggle': SMS.on = !SMS.on; if (SMS.on) { SMS.since = nowIso(); SMS.err = ''; SMS.cors = null; } smsSave(); render(); if (SMS.on) smsSoon(1000); return;
  case 'smstest': { if (!SMS.key || !SMS.from) return toast('Add the key and the sender name first'); const sent = smsSend(S.settings.momo, `StallBook test. Receipts will come from ${SMS.from}.`);
    toast('Sending a test…'); sent.then(r => { const el = document.getElementById('sms_status'); toast(r === 'ok' ? 'Test sent. Check your phone.' : r.err ? 'Not sent: ' + r.err : 'No signal. Try again.'); if (el) el.textContent = smsStatus(); }); return; }
  case 'togglesound': S.settings.sound = S.settings.sound === false; commit(); if (S.settings.sound) sfx('cash'); return render();
  case 'togglehalf': S.settings.half = S.settings.half === false; commit(); return render();
  case 'setupdone': S.setup = true; commit(); return toRoot('give');
  case 'backupsheet': return backupSheet();
  case 'backup': closeSheet(); return doBackup();
  case 'restore': { const rf = document.getElementById('restorefile'); if (rf) rf.click(); return; }
  case 'restoreyes': { if (V.restoreData) { S = V.restoreData; S.lastBackup = nowIso(); commit(); V.restoreData = null; } closeSheet(); toast('Your book is back'); return toRoot('give'); }
  case 'wipe': return sheet(`<h3>Delete everything?</h3><p>This cannot be reversed. Back up first if you are not sure.</p><div class="bar"><button class="btn ghost" data-act="sheetclose">Keep</button><button class="btn danger" data-act="wipeyes">Delete</button></div>`);
  case 'wipeyes': S = blank(); commit(); closeSheet(); toRoot('give'); return push({v: 'setup'});
  case 'reload': location.reload(); return;
  case 'installok': lsSet('stallbook_install_hint', '1'); return closeSheet();
  case 'installhelp': return installSheet();
  case 'celclose': { const c = layer.querySelector('.celebrate'); if (c) c.remove(); return; }
  case 'demo': closeSheet(); V.realS = S; V.demo = true; S = demoData(); VER++; V.fTown = ''; V.fLoc = ''; return toRoot('give');
  case 'leavedemo': S = V.realS; V.realS = null; V.demo = false; VER++; V.fTown = ''; V.fLoc = ''; closeSheet(); hideToast(); toRoot('give'); if (!S.setup && !S.people.length && !S.cars.length) push({v: 'setup'}); return;
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('ov')) { closeSheet(); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  if (b.tagName !== 'A') e.preventDefault();
  act(b.dataset.act, Object.assign({}, b.dataset), b);
});

/* ---------- fit the screen ----------
   --s sizes the whole app: 1 on an iPhone 12, up to 1.35 on tablets and computers (bigger and more rows), down to .8 on small phones.
   The app itself always fills the screen by CSS. The script only sets the scale and, while the keyboard is open, the visible height. */
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const FIT = {w: 0, h: 0};
function fit() {
  const root = document.documentElement, vv = window.visualViewport;
  const w = window.innerWidth, h = window.innerHeight;
  /* the keyboard shrinks the height on a touch screen: while a text box is being typed in, keep the tallest height seen
     so the keyboard never resizes the app. Any other change of height (the address bar, split screen) is real. */
  const ed = document.activeElement, typing = !!ed && (ed.tagName === 'TEXTAREA' || ed.tagName === 'SELECT' || (ed.tagName === 'INPUT' && !/^(button|checkbox|radio|file|submit)$/.test(ed.type)));
  FIT.h = !COARSE || !typing || w !== FIT.w ? h : Math.max(FIT.h, h); FIT.w = w;
  const sc = Math.min(1.35, Math.max(0.8, Math.min(w / 390, FIT.h / 640)));
  root.style.setProperty('--s', sc.toFixed(3));
  root.classList.toggle('short', FIT.h / sc < 700);
  const vh = vv ? vv.height : h;
  const kb = COARSE && typing && FIT.h - vh > 120;
  root.style.setProperty('--app-h', Math.round(vh) + 'px');
  root.style.setProperty('--app-top', Math.round(vv ? vv.offsetTop : 0) + 'px');
  root.classList.toggle('kb', kb);
  if (kb && window.scrollY) window.scrollTo(0, 0);
}
fit();
['resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, fit));
if (window.visualViewport) ['resize', 'scroll'].forEach(ev => window.visualViewport.addEventListener(ev, fit));
document.addEventListener('focusout', () => setTimeout(fit, 350));
window.addEventListener('pageshow', () => setTimeout(fit, 50));

/* ---------- start ---------- */
if (S.migrated) { delete S.migrated; commit(); setTimeout(() => toast('Your book from version 1 is here. Nothing was lost.'), 500); }
else if (S.upgraded) { delete S.upgraded; save(); }
if (!givingCar() && debtors().some(x => x.st.sev >= 3)) V.tab = 'collect';
try { history.replaceState({root: 1}, ''); history.pushState({g: 1}, ''); } catch (e) {}
if (!S.setup && !S.people.length && !S.cars.length) { V.stack = [{v: 'setup'}]; try { history.pushState({d: 1}, ''); } catch (e) {} }
render();
smsSoon(4000);
/* ask the phone not to clear the book when it runs low on space */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* in Safari, explain once how to put the app on the Home Screen, where the book lives */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function installSheet() {
  sheet(`<i class="grab"></i><h3>Put StallBook on your Home Screen</h3>
    <ol class="steps3"><li>Tap the <b>Share</b> button in Safari.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open StallBook from the new icon.</li></ol>
    <p>It then opens full screen, like an app. Always use the icon: a book started in Safari stays in Safari.</p>
    <button class="btn ink tall" data-act="installok">Got it</button>`);
}
if (IOS && !STANDALONE && /^https?:$/.test(location.protocol) && !lsGet('stallbook_install_hint')) setTimeout(installSheet, 600);

</script>
