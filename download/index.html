/* StallBook v3. Rule for every screen: look at the top, read the middle, touch the bottom. Give and Collect never leave the list. */
:root{
  --safe-b:max(0px,calc(env(safe-area-inset-bottom,0px) - 22px));
  --paper:#FFFFFF;--page:#FFFFFF;--rule:#C9D7F0;--margin:#E2343F;--ink:#1D3FBB;--text:#14161C;--muted:#5A6070;--faint:#6B7180;
  --owe:#D12B36;--owe-bg:#FDE8E9;--paid:#12804A;--paid-bg:#E3F4EA;--warn:#8A4F06;--warn-bg:#FFF0D2;--held:#B4690E;--bar:#1D3FBB;
  --on-btn:#FFFFFF;--key:#F1F3F8;--key-edge:#C9CFDD;--key-text:#14161C;--line:#DFE3EC;--sheet:#FFFFFF;--shade:rgba(5,8,18,.5);
  --pen-wash:#EAF0FE;--num:'Barlow Condensed','Atkinson Hyperlegible',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
/* Everything is sized in rem. --s is set by the script from the screen (1 on an iPhone 12), so the whole app grows on tablets
   and computers and shrinks a little on small phones. The app always fills the screen top to bottom. */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;font-size:calc(16px * var(--s, 1));background:#FFFFFF}
#shell{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:35rem;margin:0 auto;background:var(--paper);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
html.kb #shell{bottom:auto;top:var(--app-top,0px);height:var(--app-h)}
/* the band at the top says which job you are doing: blue is Give, green is Collect, black is Book. The status bar takes the same colour. */
html[data-mode="collect"]{--bar:#12804A}html[data-mode="book"]{--bar:#14161C}
.band{flex:none;height:2.75rem;display:flex;align-items:center;gap:.5rem;padding:0 .75rem;background:var(--bar);color:#FFFFFF}
.band .i{width:1.375rem;height:1.375rem}
.band b{flex:1;min-width:0;font:800 1.5rem/1 var(--num);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pageno{flex:none;background:#FFFFFF;color:var(--owe);font:700 1rem/1 var(--num);letter-spacing:.12em;padding:.3em .45em .24em .55em;border-radius:.2em}
.pageno.dark{color:var(--text)}
/* every number that matters is painted in the number face */
.stock .big b,.disp .v,.disp .tape,.step .num,.amt,.qbox,.csum b,.owes b,.key,.note,.tile b,.sum4 b,.chip em,.hero .n,.sv,.ccn{font-family:var(--num);font-weight:800;letter-spacing:.01em}
.amt small,.csum small{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:0}
#app{height:100%;display:flex;flex-direction:column;position:relative}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:60;pointer-events:none}
button,a,.row,.tab,.chip,.key,.face{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kb .tabs{display:none}
.kb .dock{padding-bottom:.5rem}
.steps3{margin:0;padding:0 0 0 1.375rem;display:flex;flex-direction:column;gap:.375rem;color:var(--text)}
.steps3 b{color:var(--ink)}
.ver{font-size:.8125rem;color:var(--faint);text-align:center;padding:.25rem .75rem 1rem}
#layer{position:absolute;inset:0;pointer-events:none;z-index:30}
#layer>*{pointer-events:auto}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:.1875rem solid var(--ink);outline-offset:.125rem}
.i{width:1.375rem;height:1.375rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top: look */
.top{flex:none;padding:.5rem .75rem .625rem;display:flex;flex-direction:column;gap:.5rem}
.hrow{display:flex;align-items:center;gap:.5rem;min-width:0}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem .75rem;border-radius:62.4375rem;background:var(--key);color:var(--ink);font-weight:700;font-size:.9375rem;white-space:nowrap}
.ib{width:2.75rem;height:2.75rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.ib.faint{color:var(--faint)}
.dot{position:absolute;top:.5rem;right:.5rem;width:.625rem;height:.625rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 .125rem var(--paper)}
.title{flex:1;min-width:0}
.title b{display:block;font-size:1.25rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:.8125rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;font-size:1.25rem;font-weight:700;color:var(--ink)}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .n{font-size:3.25rem;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hero .n.owe{color:var(--owe)}.hero .n.ok{color:var(--paid)}
.hero .l{font-size:.9375rem;color:var(--muted);margin-top:.125rem}
.hero .s{font-size:.8125rem;color:var(--faint);margin-top:.125rem}
.split{display:flex;justify-content:center;flex-wrap:wrap;gap:.25rem .875rem;font-size:.875rem;color:var(--muted)}
.split b{color:var(--text)}.split .w b{color:var(--warn)}.split .g b{color:var(--paid)}
.pulse{animation:tick .4s ease-out}
@keyframes tick{0%{transform:scale(1.2)}100%{transform:scale(1)}}
.chips{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;margin:0 -.75rem;padding:0 .75rem}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;padding:.5rem .875rem;border-radius:62.4375rem;border:.09375rem solid var(--line);font-size:.9375rem;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.chip.dash{border-style:dashed}

/* middle: read */
.mid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none}
.mid::-webkit-scrollbar{display:none}
.mid.book{background:linear-gradient(to right,transparent 1.6875rem,var(--margin) 1.6875rem,var(--margin) 1.8125rem,transparent 1.8125rem) var(--paper);border-top:.09375rem solid var(--rule)}
.mid.plain{border-top:.09375rem solid var(--line)}
.mid.center{padding:.75rem;gap:.625rem}
.mid.center::before{content:"";flex:1 1 auto}
.mid.run{background:var(--page);padding:.75rem}
.mid.run::before,.mid.run::after{content:"";flex:1 1 auto}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.enter{animation:enter .16s ease-out}
.ptabs{margin-top:.5rem;display:flex;align-items:flex-end;gap:.375rem}
.ptabs .chips{flex:1;min-width:0;margin-right:0;padding-right:0;align-items:flex-end}
.ptabs > .chip{flex:none}
.ptabs .chip{border:.125rem solid var(--text);border-bottom:0;border-radius:.5rem .5rem 0 0;background:var(--key);color:var(--muted);padding:.42rem .75rem .38rem}
.ptabs .chip.on{background:var(--paper);border-color:var(--text);color:var(--text);padding-bottom:.6rem}
.ptabs .chip.dash{border-style:dashed}
.top.tabbed{padding-bottom:0}
.top.tabbed + .mid{border-top:.125rem solid var(--text)}
.mid.slide-l{animation:slidel .2s ease-out}
/* the counter: the whole middle is one big button */
.mid.ctmid{padding:0}
.ctr{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;width:100%;padding:1rem 0 1.25rem;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.ctr:active{background:var(--key)}
.ctr:active .ctn{transform:scale(.96)}
.ctn{font:800 8rem/1 var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.ctr small{font-weight:700;color:var(--muted);font-size:1rem}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem;width:min(calc(100% - 2rem),20rem);margin-top:.75rem}
.dots i{display:block;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.dots i.b{background:#8EA2E6}
.mid.locked .ctr{background:var(--page)}
.kpick{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.125rem 0}
.kpick::-webkit-scrollbar{display:none}
.kpick button{flex:none;border-radius:.875rem;padding:.15rem;border:.18rem solid transparent}
.kpick button.on{border-color:var(--ink)}
.ctrip{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--muted)}
.ctrip span{flex:1}
.ctrip button{display:flex;align-items:center;justify-content:center;flex:none;width:3.25rem;height:3rem;border-radius:.875rem;background:var(--key);font:800 1.75rem/1 var(--num);color:var(--text)}
.ctrip button.on{background:var(--ink);color:#fff}
.holdbtn{position:relative;overflow:hidden}
.holdbtn::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.32);transform:scaleX(0);transform-origin:left;pointer-events:none}
.holdbtn.ghost::after,.sq.holdbtn::after{background:rgba(29,63,187,.16)}
.holdbtn.holding::after{transform:scaleX(1);transition:transform var(--hold,.65s) linear}
.ctwho{display:flex;flex-direction:column;max-height:42vh;overflow-y:auto;margin:0 -.875rem;border-top:.0625rem solid var(--line);scrollbar-width:none}
.who1{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:.875rem;border-bottom:.0625rem solid var(--line);text-align:left}
.who1 b{font-size:1.25rem;color:var(--ink)}
.who1 small{color:var(--muted)}
.who1[hidden],#ctnew[hidden]{display:none}
/* a new line is written in, left to right, like a pen */
.row.flash.new .who,.row.flash.new .amt,.row.flash .amt small.ok{animation:write .5s cubic-bezier(.4,.1,.3,1)}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* a new load: the page turns */
.turn{animation:turn .55s cubic-bezier(.2,.7,.3,1);transform-origin:left center}
@keyframes turn{from{transform:perspective(60rem) rotateY(55deg);opacity:0}to{transform:none;opacity:1}}
/* totals sit on a double rule, like a ledger */
.dbl{display:inline-block;border-bottom:.3rem double currentColor;padding:0 .1em .05em}
.mid.slide-r{animation:slider .2s ease-out}
@keyframes slidel{from{opacity:.3;transform:translateX(2.25rem)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:.3;transform:translateX(-2.25rem)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(.375rem)}to{opacity:1;transform:none}}
.lines{margin-top:auto}
.lines.down{margin-top:0}
.row{display:flex;align-items:center;gap:.625rem;width:100%;min-height:3.875rem;padding:.5rem .75rem .5rem 2.5rem;border-bottom:.09375rem solid var(--rule);text-align:left;position:relative}
.row .who{flex:1;min-width:0;text-align:left}
.row.wait{background:var(--warn-bg)}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
.row.gone .who,.row.gone .amt{text-decoration:line-through;color:var(--faint)}
.name{font-size:1.125rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.8125rem;color:var(--faint);margin-top:.0625rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:1rem;color:var(--text)}
.amt{font-size:1.5rem;font-weight:700;color:var(--owe);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.amt.ink{color:var(--ink)}.amt.ok{color:var(--paid)}.amt.faint{color:var(--faint);font-weight:400;font-size:.9375rem}
.amt small{display:block;font-size:.75rem;font-weight:400;color:var(--faint)}
.d{flex:none;width:2.875rem;font-size:.8125rem;color:var(--faint)}
.mk{position:absolute;left:.375rem;top:50%;transform:translateY(-50%);width:1.125rem;text-align:center;font-weight:700;font-size:1rem}
.mk.ok{color:var(--paid)}.mk.w{color:var(--warn)}.mk.r{color:var(--owe)}
.takebtn{flex:none;min-height:2.875rem;padding:0 .875rem;border-radius:.75rem;background:var(--owe);color:var(--on-btn);font-weight:700;font-size:.9375rem;display:flex;align-items:center;gap:.25rem}
.sect{display:flex;align-items:center;gap:.5rem;min-height:2.875rem;padding:.5rem .75rem .375rem 2.5rem;font-size:.875rem;font-weight:700;color:var(--muted);border-bottom:.09375rem solid var(--rule)}
.sect span{flex:1}
.sect.w{color:var(--warn)}
.sect .mini{padding:.4375rem .75rem;border-radius:.5625rem;background:var(--key);color:var(--ink);font-size:.875rem}
.endrow{display:flex;align-items:center;gap:.5rem;width:100%;min-height:3.25rem;padding:.625rem .75rem .625rem 2.5rem;font-size:.9375rem;font-weight:700;color:var(--muted);text-align:left}
.empty{padding:1.75rem 1.125rem 1.5rem 2.5rem;color:var(--muted)}
.empty h2{margin:0 0 .25rem;font-size:1.25rem;color:var(--ink)}
.empty p{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.125rem .4375rem;border-radius:.375rem;background:var(--key);color:var(--ink);white-space:nowrap;vertical-align:.0625rem}
.tag.ok{background:var(--paid-bg);color:var(--paid)}.tag.w{background:var(--warn-bg);color:var(--warn)}.tag.r{background:var(--owe-bg);color:var(--owe)}
.tags{display:flex;flex-wrap:wrap;gap:.3125rem;justify-content:center}
.tags.l{justify-content:flex-start}
.owes{text-align:center;display:flex;flex-direction:column;align-items:center}
.owes small{font-size:.875rem;color:var(--muted)}
.owes b{font-size:3.5rem;line-height:1.05;color:var(--owe);font-variant-numeric:tabular-nums}
.owes b.ok{color:var(--paid);font-size:1.875rem}
.owes span{font-size:.875rem;color:var(--muted)}
.showher{display:inline-flex;align-items:center;gap:.375rem;margin-top:.375rem;padding:.375rem .875rem;border-radius:62.4375rem;background:var(--key);color:var(--ink);font-weight:700;font-size:.875rem}

/* bottom: touch */
.dock{flex:none;padding:.5rem .75rem .625rem;border-top:.0625rem solid var(--line);display:flex;flex-direction:column;gap:.5rem;background:var(--paper);position:relative;z-index:5}
.dock.last{padding-bottom:calc(.625rem + var(--safe-b))}
.bar{display:flex;gap:.5rem;align-items:stretch}
.lh .bar{flex-direction:row-reverse}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.5rem;padding:0 .75rem;border-radius:.875rem;font-size:1.0625rem;font-weight:700;text-align:center;min-width:0;line-height:1.15}
.btn small{display:block;font-size:.75rem;font-weight:400;opacity:.85}
.btn.tall{min-height:4rem;font-size:1.1875rem}
.btn.give{background:var(--owe);color:var(--on-btn)}
.btn.take{background:var(--paid);color:var(--on-btn);border-bottom:.22rem solid rgba(0,0,0,.28)}
.btn.ink{background:var(--ink);color:var(--on-btn);border-bottom:.22rem solid rgba(0,0,0,.28)}
.btn.ghost{border:.09375rem solid var(--line);color:var(--ink)}
.btn.call{background:var(--paid-bg);color:var(--paid)}
.btn.msg{background:var(--key);color:var(--ink)}
.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.redtext{color:var(--owe)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sq{flex:none;width:3.625rem;min-height:3.5rem;border-radius:.875rem;border:.09375rem solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.0625rem}
.sq small{font-size:.6875rem;font-weight:700}
.sq.cash{color:var(--paid)}
.sq.call{border:0;background:var(--paid-bg);color:var(--paid)}
.sq.msg{border:0;background:var(--key)}
.sq[disabled]{opacity:.4;pointer-events:none}
.find{flex:1;display:flex;align-items:center;gap:.5rem;min-height:3.5rem;padding:0 .375rem 0 .875rem;border-radius:.875rem;border:.125rem solid var(--owe);background:var(--owe-bg);color:var(--owe);min-width:0;cursor:text}
.find input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1.0625rem;font-weight:700;color:var(--text);padding:.75rem 0}
.find input::placeholder{color:var(--owe);opacity:.9}
.find.ink{border-color:var(--ink);background:var(--paper);color:var(--ink)}
.find.ink input::placeholder{color:var(--faint);font-weight:400}
.faces{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;margin:0 -.75rem;padding:0 .75rem}
.faces::-webkit-scrollbar{display:none}
.face{flex:none;display:flex;align-items:center;gap:.375rem;padding:.1875rem .75rem .1875rem .1875rem;border-radius:62.4375rem;border:.09375rem solid var(--line);font-size:.875rem;font-weight:700;color:var(--ink);min-height:2.625rem}
.av{flex:none;width:2.125rem;height:2.125rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8125rem;font-weight:700;background:var(--key);color:var(--ink)}
.av.lg{width:2.875rem;height:2.875rem;font-size:1rem}
.av.xl{width:4.5rem;height:4.5rem;font-size:1.5625rem}
.strip{display:flex;align-items:center;gap:.5rem;width:100%;padding:.625rem .75rem;border-radius:.75rem;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.9375rem;text-align:left}
.strip span{flex:1}
.suggest{position:absolute;left:0;right:0;bottom:100%;background:var(--paper);border-top:.0625rem solid var(--line);box-shadow:0 -.625rem 1.5rem rgba(0,0,0,.14);max-height:min(20.625rem,52vh);overflow-y:auto;display:flex;flex-direction:column-reverse;z-index:6}
.sg{display:flex;align-items:center;gap:.625rem;width:100%;min-height:3.625rem;padding:.5rem .875rem;border-top:.0625rem solid var(--line);text-align:left}
.sg .who{flex:1;min-width:0}
.sg.new .name{color:var(--owe)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:.0625rem solid var(--line);background:var(--paper);padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;min-height:3.625rem;font-size:.8125rem;font-weight:700;color:var(--faint);position:relative;text-align:center}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:.1875rem;border-radius:0 0 .1875rem .1875rem;background:var(--ink)}
.badge{position:absolute;top:.3125rem;left:calc(50% + .375rem);min-width:1.1875rem;height:1.1875rem;border-radius:.625rem;background:var(--owe);color:var(--on-btn);font-size:.6875rem;display:flex;align-items:center;justify-content:center;padding:0 .3125rem}

/* keypad and money */
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4375rem}
.kp{gap:.5rem .5rem}
.key{min-height:3.375rem;border-radius:62.4375rem;background:var(--key);color:var(--key-text);font-size:2.125rem;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:background-color .25s ease-out;-webkit-user-select:none;user-select:none}
.key:active{background:#D5DAE6;transition:none;transform:none}
.key.wide{grid-column:span 2}
.key.op{background:var(--pen-wash);color:var(--ink);font-size:1.75rem}
.key.op:active{background:#CBD8FB}
.key.del{color:var(--muted)}
.key.del.cleared{background:var(--owe-bg);color:var(--owe)}
.key.ok{background:var(--ink);color:#FFFFFF;font:700 1.0625rem/1.1 'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:0;text-align:center;padding:0 .25rem}
.key.ok:active{background:#16308F}
.key.ok.take{background:var(--paid)}
.key.ok.take:active{background:#0D6339}
.key.ok[disabled]{opacity:.4}
.kp.pay .key{min-height:3.125rem}
.notes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.3125rem}
.note{min-height:2.625rem;border-radius:.5625rem;border:.09375rem dashed var(--paid);background:var(--paid-bg);color:var(--paid);font-weight:700;font-size:.9375rem;display:flex;align-items:center;justify-content:center}
.disp{padding:.625rem .875rem;border-radius:1rem;background:var(--key);text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:.125rem}
.disp .tape{font-size:1.25rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-height:1.25rem}
.disp .tape::-webkit-scrollbar{display:none}
.disp .v{font-size:3.25rem;font-weight:700;line-height:1.1;color:var(--ink);word-break:break-all}
.disp .v.g{color:var(--paid)}
.disp .s{font-size:.875rem;color:var(--muted);min-height:1.1875rem}
.clears{font-size:.875rem;color:var(--muted);text-align:center;min-height:1.1875rem}
.clears b{color:var(--paid)}
.err{color:var(--owe);font-size:.875rem;min-height:1.1875rem;text-align:center}
.q{font-size:1.625rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.25}
/* bag kinds: the photo is the button */
.kimg{display:block;width:3rem;height:3rem;border-radius:.5rem;object-fit:cover;background:var(--key);border:.125rem solid var(--text);flex:none}
.kimg.none{display:flex;align-items:center;justify-content:center;font:800 1.5rem/1 var(--num);color:var(--ink);background:var(--pen-wash)}
.kimg.xs{width:1.375rem;height:1.375rem;border-width:.09375rem;border-radius:.3rem;font-size:.8125rem;display:inline-flex;vertical-align:middle}
.kimg.sm{width:2.25rem;height:2.25rem;font-size:1.125rem}
.kimg.big{width:100%;height:6.75rem;border:0;border-radius:0;font-size:2.75rem}
.kimg.hero{width:12rem;height:9rem;border-radius:.875rem;font-size:4rem}
.kstrip{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;margin:0 -.75rem;padding:0 .75rem}
.kthumb{flex:none;border-radius:.625rem;padding:.125rem;border:.125rem solid transparent}
.kthumb.on{border-color:var(--ink)}
.camera{align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;width:12rem;height:9rem;border-radius:.875rem;border:.1875rem dashed var(--ink);background:var(--pen-wash);color:var(--ink);font-weight:700}
.camera .i{width:3rem;height:3rem}
.photowrap{align-self:center;position:relative}
.retake{position:absolute;right:.5rem;bottom:.5rem;width:2.75rem;height:2.75rem;border-radius:50%;background:#FFFFFF;border:.125rem solid var(--text);display:flex;align-items:center;justify-content:center;color:var(--text)}
.kinds{display:flex;flex-direction:column;gap:.375rem;width:100%;max-width:22rem;align-self:center}
.kindrow{display:flex;align-items:center;gap:.75rem;padding:.5rem .625rem;border-radius:.75rem;background:var(--key);text-align:left}
.kindrow b{flex:1;font:800 1.625rem/1 var(--num);color:var(--text)}
.kindrow span{font-weight:700;color:var(--muted)}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.ktile{position:relative;border:.125rem solid var(--text);border-radius:.75rem;overflow:hidden;background:var(--paper)}
.ktile.on{border-color:var(--ink);box-shadow:0 0 0 .1875rem var(--ink)}
.ktile .kt{display:flex;flex-direction:column;width:100%;touch-action:manipulation}
.kcap{display:flex;align-items:baseline;justify-content:space-between;gap:.25rem;padding:.25rem .5rem .3rem}
.kcap b{font:800 1.75rem/1 var(--num);color:var(--text)}
.kcap small{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.kn{position:absolute;top:.375rem;right:.375rem;min-width:2.5rem;height:2.5rem;padding:0 .375rem;border-radius:.375rem;background:var(--ink);color:#FFFFFF;font:800 1.875rem/1 var(--num)}
.kless{position:absolute;top:.375rem;left:.375rem;width:2.5rem;height:2.5rem;border-radius:50%;background:#FFFFFF;border:.125rem solid var(--text);font:800 1.875rem/1 var(--num);color:var(--text);display:flex;align-items:center;justify-content:center;padding-bottom:.125rem}
.ktot{display:flex;align-items:baseline;justify-content:center;gap:.625rem}
.ktot b{font:800 2.5rem/1 var(--num);color:var(--ink)}
.ktot small{font-size:1rem;font-weight:700;color:var(--muted)}
.qs{font-size:.9375rem;color:var(--muted);text-align:center}
.seg{display:flex;gap:.25rem;padding:.25rem;border-radius:.875rem;background:var(--key)}
.seg button{flex:1;min-height:2.75rem;border-radius:.6875rem;font-weight:700;font-size:.9375rem;color:var(--muted);text-align:center;padding:0 .375rem}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 .0625rem .1875rem rgba(0,0,0,.15)}
.seg button.on.w{background:var(--warn-bg);color:var(--warn)}
.step{display:flex;align-items:center;justify-content:center;gap:1.125rem}
.step .key{width:4rem;min-height:4rem;border-radius:50%;font-size:2rem}
.step .num{min-width:5.75rem;text-align:center;font-size:3.25rem;font-weight:700;line-height:1;color:var(--ink)}
.step .num small{display:block;font-size:.875rem;font-weight:400;color:var(--muted);margin-top:.25rem}
.halfbtn{padding:.5625rem 1rem;border-radius:62.4375rem;border:.09375rem solid var(--line);font-weight:700;color:var(--ink);font-size:.9375rem}
.halfbtn.on{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.total{font-size:.875rem;color:var(--muted);text-align:right}
.total b{font-size:1.375rem;color:var(--owe);margin-left:.25rem}
.total button{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:.1875rem}

/* sheets, toasts */
.ov{position:absolute;inset:0;background:var(--shade);display:flex;align-items:flex-end;animation:fade .15s ease-out;z-index:35}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:1.375rem 1.375rem 0 0;padding:.5rem .875rem calc(.875rem + var(--safe-b));display:flex;flex-direction:column;gap:.75rem;animation:up .2s ease-out;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.ov.still,.ov.still .sheet{animation:none}
.grab{display:block;width:2.625rem;height:.3125rem;border-radius:.1875rem;background:var(--line);margin:.125rem auto 0}
.sheet h3{margin:0;font-size:1.3125rem;color:var(--ink)}
.sheet p{margin:0;color:var(--muted)}
.sheet .center{text-align:center}
.small{font-size:.8125rem;color:var(--faint)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(2.5rem);opacity:.6}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{position:absolute;left:.75rem;right:.75rem;bottom:calc(.75rem + var(--safe-b));display:flex;align-items:center;gap:.375rem;padding:.5rem .5rem .5rem .875rem;border-radius:.875rem;background:var(--text);color:var(--paper);font-size:.9375rem;box-shadow:0 .5rem 1.375rem rgba(0,0,0,.25);animation:pop .17s ease-out;z-index:40}
.toast span{flex:1;padding:.25rem 0}
.toast{pointer-events:none}
.toast.over-dock{bottom:calc(100% + .625rem)}
.toast button,.toast a{pointer-events:auto}
.toast.still{animation:none}
.toast button,.toast a{flex:none;font-weight:700;padding:.5625rem .75rem;border-radius:.625rem;background:var(--paper);color:var(--text);font-size:.875rem}
.field{display:flex;flex-direction:column;gap:.3125rem}
.field label{font-size:.875rem;color:var(--muted)}
.field input{width:100%;padding:.6875rem .75rem;border-radius:.75rem;border:.09375rem solid var(--line);background:var(--paper);font-size:1.125rem;min-height:3.25rem;outline:none}
.field input:focus{border-color:var(--ink)}
.msgprev{padding:.75rem .875rem;border-radius:.875rem;background:var(--key);font-size:.9375rem;line-height:1.45;color:var(--text)}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.datebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.875rem;border-radius:.875rem;border:.09375rem solid var(--line);color:var(--ink)}
.datebtn b{font-size:1.125rem}.datebtn small{font-size:.8125rem;color:var(--faint)}
.datebtn.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.datebtn.on small{color:var(--on-btn);opacity:.8}
.cs-amt{font-size:2.875rem;font-weight:700;color:var(--paid);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.cs-left{text-align:center;font-size:1.125rem;color:var(--muted)}
.cs-left b{color:var(--owe);font-size:1.375rem}
/* proof of payment: the pen at work */
.proof{position:relative}
.pf-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.25rem 0 .75rem}
.pf-head>div{min-width:0}
.pf-head small{display:block;font-weight:700;color:var(--muted)}
.pf-head b{font:800 3.5rem/1 var(--num);color:var(--paid)}
.pf-lines{border-top:.125rem solid var(--text);margin:0 -.875rem;background:linear-gradient(to right,transparent 2.4rem,var(--margin) 2.4rem,var(--margin) 2.525rem,transparent 2.525rem)}
.pf-line{position:relative;display:flex;align-items:center;gap:.5rem;min-height:3.75rem;padding-right:.875rem;border-bottom:.09375rem solid var(--rule)}
.pf-mk{width:2.4rem;flex:none;display:flex;justify-content:center}
.pf-d{flex:1;min-width:0;padding-left:.5rem;font-weight:700;color:var(--ink)}
.pf-d small{display:block;font-weight:400;font-size:.8125rem;color:var(--muted)}
.pf-a{font:800 1.875rem/1 var(--num);color:var(--text)}
.pf-note{flex:none;font:700 1.5rem/1 var(--num);color:var(--ink);transform:rotate(-5deg);animation:pfshow .25s ease-out backwards;animation-delay:var(--d)}
.pf-strike{position:absolute;left:2.8rem;top:50%;height:1.9rem;width:calc(100% - 3.3rem);transform:translateY(-50%);overflow:visible;pointer-events:none}
.pf-strike path,.pf-ring path{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1;animation:pfdraw .45s ease-out backwards;animation-delay:var(--d)}
.pf-tick{width:1.375rem;height:1.375rem;fill:none;stroke:var(--paid);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:pfshow .2s ease-out backwards;animation-delay:var(--d)}

    locs     places {id, town, spot}: town is the place's name, spot is always '' since v4

    cars     one per delivery: label, items (product or size, count, price), costs, phase giving|out
    entries  append-only book lines; nothing is overwritten:

      pay     money in (cash or momo); with = the give she paid for there and then

      stock   bags in or out of a delivery: count fixed, kept for next, sent back, spoiled
      move    she now sells somewhere else (from, to)
      promise she said she will pay on a day
      note    kind 'refused'
      gap     bags that left the car with no name (found by a count check): {carId, itemId, bags, price, loc}.

const VIEWS = {};
/* numbers move to their new value: the old number counts up or down, quickly. data-roll names the number,
   data-v is its value, data-f="m" means money, data-up counts up from 0 each time the page opens. */
const ROLL = {};
function rollNums(same) {
  app.querySelectorAll('[data-roll]').forEach(el => {
    const k = el.dataset.roll, v = +el.dataset.v; let was = ROLL[k]; ROLL[k] = v;
    if (el.dataset.up && !same) was = 0;
    if (was === undefined || Math.abs(was - v) < 0.005 || RM()) return;
    const f = el.dataset.f === 'm' ? money : bagsNum, t0 = performance.now(), dur = el.dataset.up ? 700 : 420;
    const step = now => {
      if (!el.isConnected) return; const x = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - x, 3);
      el.textContent = x < 1 ? f(Math.round(was + (v - was) * ease)) : f(v); if (x < 1) requestAnimationFrame(step);
    };
    el.textContent = f(Math.round(was)); requestAnimationFrame(step);
  });
}
function render() {
  const f = cur();

  else { key = f.v + ':' + (f.pid || f.cid || ''); o = VIEWS[f.v](f); if (!o) return; }
  const old = document.getElementById('mid');
  const same = key === lastKey && old;
  const keepTop = same ? old.scrollTop : 0;
  const wasBottom = same ? old.scrollHeight - old.scrollTop - old.clientHeight < 6 : true;

    + (o.tabs ? band() : '')

    + (o.dock ? `<footer class="dock${o.tabs ? '' : ' last'}">${o.dock}</footer>` : '') + (o.tabs ? tabBar() : '');
  const m = document.getElementById('mid');

/* ===== Bag photos =====
   Each kind of bag in a delivery has a photo, saved small on the phone (IndexedDB) and put in backup files.
   Old deliveries keep their photos, so old debts still show what was taken. */
const PH = {}; let phDB = null;
function phOpen() {
  return new Promise(res => {
    try { const r = indexedDB.open('stallbook-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => { phDB = r.result; res(phDB); }; r.onerror = () => res(null); }
    catch (e) { res(null); }

}

function readPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const m = 360, sc = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };

}

function saveCheck() {
  const car = givingCar(); const cc = V.cc; if (!car || !cc) return closeSheet();
  const rows = []; let short = 0, more = 0, flash = null;
  cc.rows.forEach(r => {
    const I = carStats(car.id).items.find(i => i.id === r.id); if (!I) return;
    const diff = Math.max(0, I.free) - r.n; rows.push({itemId: r.id, was: Math.max(0, I.free), now: r.n});
    if (diff > 0) { const g = add({type: 'gap', carId: car.id, itemId: r.id, bags: diff, price: I.price, loc: locById(S.lastLoc) ? S.lastLoc : ''}); short += diff; flash = g.id; }
    else if (diff < 0) {
      let found = -diff; more += found;
      gapsOn(car.id).filter(g => g.itemId === r.id).sort((a, b) => cmp(b.date, a.date)).forEach(g => { if (found <= 0) return; const take = Math.min(g.bags, found); shrinkGap(g, take); found -= take; });
      if (found > 0) add({type: 'stock', carId: car.id, itemId: r.id, bags: found, reason: 'count'});
    }
  });
  add({type: 'check', carId: car.id, rows, loc: locById(S.lastLoc) ? S.lastLoc : ''});
  car.checkedAt = nowIso(); commit(); V.cc = null; V.ask = false; V.flash = flash;

}

/* ===== Collect ===== */
function collectLists() {
  const q = V.cq.trim().toLowerCase();
  const all = debtors().filter(x => inFilter(x.p) && (!q || x.p.name.toLowerCase().includes(q)));
  const bySev = (a, b) => b.st.sev - a.st.sev || b.L.bal - a.L.bal;
  const now = all.filter(x => x.st.sev >= 3).sort(bySev);
  const prom = all.filter(x => x.st.k === 'promised').sort((a, b) => cmp(a.st.on, b.st.on));
  const later = all.filter(x => x.st.sev < 3 && x.st.k !== 'promised').sort((a, b) => cmp(a.st.due || '', b.st.due || ''));
  return {all, now, prom, later, order: [...now, ...prom, ...later]};
}

/* money pad over the list: the calculator lives where money is typed */
const paySum = () => r2(exprNum(V.pay.ex));
function payPreview(pid, amt, loadId) {
  const open = ledger(pid).loads.filter(L => L.left > 0.001); const first = open.find(L => L.id === loadId);
  const order = (first ? [first] : []).concat(open.filter(L => L !== first)); let r = amt; const outp = [];
  for (const L of order) { if (r <= 0.001) break; const k = Math.min(L.left, r); r -= k; outp.push({L, k, cleared: k >= L.left - 0.001}); }
  return outp;
}
function openPay(pid, o) { V.pay = Object.assign({pid, ex: '', method: 'cash', err: '', loadId: null, ctx: 'collect', over: ''}, o || {}); paySheet(); }
function nextPayId(pid) { const ord = collectLists().order.map(x => x.p.id); const i = ord.indexOf(pid); return ord.slice(i + 1).find(id => id !== pid) || null; }
function paySheet() {
  const P = V.pay; const p = person(P.pid); const L = ledger(p.id); const a = paySum(); const left = r2(L.bal - a);
  const over = a > Math.max(0, L.bal) + 0.001;

    ${over ? `<div class="over">What about the extra ${money(a - Math.max(0, L.bal))}?<div class="bar"><button class="chip ${P.over === 'credit' ? 'on' : ''}" data-act="pover" data-v="credit">Keep as credit</button><button class="chip ${P.over === 'change' ? 'on' : ''}" data-act="pover" data-v="change">Gave change</button></div></div>`

    <div class="seg mini2"><button class="${P.method === 'cash' ? 'on' : ''}" data-act="method" data-m="cash">Cash</button><button class="${P.method === 'momo' ? 'on' : ''}" data-act="method" data-m="momo">MoMo</button></div>

/* saves the payment; returns false when something is missing */
function savePay() {
  const P = V.pay; const a = paySum(); const p = person(P.pid); const L = ledger(p.id);

  const over = a > Math.max(0, L.bal) + 0.001;
  if (over && !P.over) { P.err = 'Choose what happens to the extra.'; paySheet(); return false; }
  const amount = over && P.over === 'change' ? Math.max(0, L.bal) : a;
  if (!amount) { P.err = 'She owes nothing. Keep it as credit, or give it back.'; paySheet(); return false; }
  const outBefore = new Map(S.cars.filter(c => c.phase === 'out').map(c => [c.id, carStats(c.id).out]));
  const pv = payPreview(p.id, amount, P.loadId);
  const e = add(Object.assign({type: 'pay', pid: p.id, amount, method: P.method, loadId: P.loadId || null, carId: null, rcpt: !p.phone}, over && P.over === 'change' ? {change: r2(a - amount)} : {}));
  const bal = ledger(p.id).bal;
  sfx('cash'); buzz(25);
  const done = S.cars.find(c => c.phase === 'out' && outBefore.get(c.id) > 0.001 && carStats(c.id).out <= 0.001);
  V.celebrateCar = done || null;
  V.flashPay = {pid: p.id, amt: amount, t: Date.now()};
  V.lastPay = {e, p, amount, bal, pv, change: over && P.over === 'change' ? r2(a - amount) : 0, credit: over && P.over !== 'change' ? r2(a - amount) : 0};
  return true;
}

/* ===== Counter: tap once for each trip; the phone keeps the count ===== */
const CT_KEY = 'stallbook_counter';
function ctLoad(car) {
  if (V.ct && V.ct.carId === car.id) return V.ct;
  let c = null; try { c = JSON.parse(lsGet(CT_KEY) || 'null'); } catch (e) {}
  if (!c || c.carId !== car.id || Date.now() - (c.t || 0) > 12 * 3600000) c = {carId: car.id, mode: 'out', kind: car.items[0].id, trip: 2, taps: [], locked: false, t: Date.now()};
  if (!car.items.some(i => i.id === c.kind)) c.kind = car.items[0].id;
  return (V.ct = c);
}
function ctSave() { if (!V.ct) return; V.ct.t = Date.now(); lsSet(CT_KEY, JSON.stringify(V.ct)); }
function ctClear() { V.ct = null; try { localStorage.removeItem(CT_KEY); } catch (e) {} }
const ctTotal = () => V.ct ? sum(V.ct.taps, x => x) : 0;
VIEWS.counter = () => {

function closeCar() {
  const car = carById(V.cl.cid); const st = carStats(car.id); const left = Math.max(0, st.free); const ids = []; const ch = V.cl.choice;
  if (left > 0) {
    const parts = st.items.map(I => ({itemId: I.id, price: I.price, bags: Math.max(0, I.free)}));
    const s = sum(parts, x => x.bags); if (s !== left) parts[0].bags = Math.max(0, parts[0].bags + (left - s));
    parts.forEach(pt => { if (!pt.bags) return; const e = ch === 'cash' ? add({type: 'cash', pid: null, carId: car.id, itemId: pt.itemId, bags: pt.bags, price: pt.price, amount: r2(pt.bags * pt.price)}) : add({type: 'stock', carId: car.id, itemId: pt.itemId, bags: -pt.bags, reason: ch}); ids.push(e.id); });
    if (ch === 'next') S.carry = (Number(S.carry) || 0) + left;
  }
  car.phase = 'out'; car.closedAt = nowIso(); car.closeIds = ids; car.closeCarry = ch === 'next' ? left : 0; commit();
  const then = V.cl.thenNew; V.cl = null; closeSheet();
  if (then) return startWizard();

}

      V.restoreData = data.v >= 2 ? normalize(data) : normalize(fromV1(data));

  r.readAsText(file); e.target.value = '';

function doBackup() {
  const d = new Date(); const name = `StallBook-backup-${dayKey(d)}.json`;
  const photos = {}; S.cars.forEach(c => c.items.forEach(i => { if (i.photo && PH[i.photo]) photos[i.photo] = PH[i.photo]; }));
  const json = JSON.stringify({stallbook: S, savedAt: d.toISOString(), version: 3, photos});
  const done = () => { S.lastBackup = nowIso(); save(); render(); toast('Backup ready. Keep it in WhatsApp.'); };
  try { const file = new File([json], name, {type: 'application/json'}); if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: 'StallBook backup', text: 'StallBook backup, ' + dmy(d)}).then(done).catch(() => {}); return; } } catch (x) {}
  try { const url = URL.createObjectURL(new Blob([json], {type: 'application/json'})); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); done(); } catch (x) { toast('Backup did not work on this phone'); }
}

/* ===== actions ===== */
function act(a, d, el) {
  d = d || {};
  switch (a) {
  case 'noop': return;
  case 'tab': V.tab = d.t; V.stack = []; V.qe = null; closeSheet(); hideToast(); return render();
  case 'back': return pop();
  case 'sheetclose': return closeSheet();
  case 'settings': return push({v: 'settings'});
  case 'person': closeSheet(); return push({v: 'person', pid: d.id});
  case 'show': return push({v: 'show', pid: d.id});
  case 'mom': return push({v: 'mom'});
  case 'report': closeSheet(); return push({v: 'report', cid: d.id});
  case 'carmenu': return carMenu(d.id);

  case 'gotogive': return toRoot('give');

  /* give */
  case 'pick': return pickName(d.id || null, d.name || '');

  case 'gminus': if (V.g.bags >= 1.5) V.g.bags -= 1; else if (V.g.bags > 0.5 && S.settings.half) V.g.bags = 0.5; return giveSheet();

  case 'qtyback': return giveSheet();
  case 'qtyuse': { const n = Math.round(exprNum(V.qk.v)); if (V.qk.kind && V.g.kinds) { V.g.kinds[V.qk.kind] = n; V.g.bags = sum(Object.values(V.g.kinds), x => x); V.qk = null; return giveSheet(); } if (n > 0) V.g.bags = n; return giveSheet(); }
  case 'ghold': V.g.hold = !V.g.hold; return giveSheet();

  case 'gkless': { const g = V.g; g.kinds[d.i] = Math.max(0, (g.kinds[d.i] || 0) - 1); g.bags = sum(Object.values(g.kinds), x => x); return giveSheet(); }

  case 'here': return locSheet({mode: 'here', sel: S.lastLoc});
  case 'gtab': { const car = givingCar(); const tabs = car ? giveTabs(car) : []; const from = tabs.indexOf(giveTab(tabs)), to = tabs.indexOf(d.id); if (to < 0 || to === from) return; V.slide = to > from ? 'l' : 'r'; S.lastLoc = d.id; save(); return render(); }
  case 'gsave': return saveGive(false);

  case 'gback': return giveSheet();
  case 'dupyes': V.g.pid = d.id; return saveGive(!!V.dupForce);

  case 'cash': { const car = givingCar(); if (car.items.length > 1) return sheet(`<i class="grab"></i><h3>Sold for cash</h3><p>Which one?</p>${car.items.map(i => `<button class="btn ghost" style="justify-content:flex-start" data-act="cashitem" data-i="${i.id}">${kindImg(i, 'sm')} ${esc(kindLabel(i))}</button>`).join('')}<button class="btn ghost" data-act="sheetclose">Cancel</button>`); return act('cashitem', {i: car.items[0].id}); }
  case 'cashitem': { const car = givingCar(); const it = car.items.find(i => i.id === d.i); closeSheet(); if (carStats(car.id).free < 1) return toast('No ' + unit() + 's left in the vehicle');
    const e = add({type: 'cash', pid: null, carId: car.id, itemId: it.id, bags: 1, price: it.price, amount: it.price, loc: locById(S.lastLoc) ? S.lastLoc : ''}); sfx('coin'); buzz(15); V.pulse = true; render();
    say(`Sold one for ${cedis(it.price)}. ${bagsNum(Math.max(0, carStats(car.id).free))} left.`);
    return; }

  case 'receipts': { const car = givingCar(); const m = pendingReceipts(car ? car.id : null); V.queue = {kind: 'rcpt', ids: [...m.keys()], i: 0, carId: car ? car.id : null}; return queueStep(); }

  /* in-row correction */
  case 'qedit': { const e = byId(d.id); V.qe = {id: d.id, n: e.bags}; return render(); }
  case 'qminus': if (V.qe.n >= 1.5) V.qe.n -= 1; else if (V.qe.n > 0.5 && S.settings.half) V.qe.n = 0.5; return render();
  case 'qplus': V.qe.n = Math.min(999, V.qe.n + 1); return render();
  case 'qcancel': V.qe = null; return render();
  case 'qsave': { const Q = V.qe; V.qe = null; const e = byId(Q.id); if (!e || Q.n === e.bags) return render(); const n = fixGive(Q.id, {bags: Q.n}); const p = person(e.pid); V.flash = n.id; render(); return toast(`${p ? p.name : ''} · ${bagsNum(e.bags)} → ${bagsNum(Q.n)}`, []); }

  case 'eshalf': { const n = V.es.n; V.es.n = Math.abs(n % 1 - 0.5) < 0.01 ? n - 0.5 : n + 0.5; if (V.es.n < 0.5) V.es.n = 0.5; return entrySheet(V.es.id); }
  case 'essave': { const e = byId(V.es.id); const n = fixGive(V.es.id, {bags: V.es.n}); closeSheet(); V.flash = n.id; render(); return toast(`${bagsNum(e.bags)} → ${bagsNum(V.es.n)}`, []); }
  case 'eswho': return nameSheet(V.es.id);
  case 'esloc': { const e = byId(V.es.id); return locSheet({mode: 'entry', id: e.id, sel: e.loc}); }
  case 'nspick': { const e = byId(V.ns.id); let pid = d.id; if (!pid) { const p = {id: uid(), name: d.name.trim(), phone: '', loc: e.loc || '', note: '', created: nowIso()}; S.people.push(p); pid = p.id; }

  case 'handall': { const car = carById(d.id) || givingCar(); const gs = heldOn(car.id).filter(e => d.loc === undefined || d.loc === '*' || locKey(e) === d.loc); if (!gs.length) return; const hs = handOver(gs, ''); sfx('bag');

  case 'cashless': { const car = givingCar(); const cs = S.entries.filter(e => e.type === 'cash' && e.carId === car.id && live(e) && (d.loc === '*' || locKey(e) === d.loc)); if (cs.length) undoEntry(cs[cs.length - 1].id); V.pulse = true; render(); return cs.length > 1 ? act('cashfix', d) : closeSheet(); }
  case 'release': { const e = byId(d.id); undoEntry(d.id, 'release'); closeSheet(); render(); return toast(`${bagsTxt(e.bags)} back in the vehicle`, []); }

  case 'edit': return editSheet(d.id);
  case 'edsave': { const p = person(V.ed.pid); const name = document.getElementById('e_name').value.trim(); if (!name) { document.getElementById('e_err').textContent = 'Write her name.'; return; }
    p.name = name; p.phone = document.getElementById('e_phone').value.trim(); commit(); closeSheet(); return render(); }
  case 'msg': return msgSheet(d.id);
  case 'msgkind': return msgSheet(d.id, d.k);
  case 'msgsent': { const p = person(d.id); p.via = d.via; if (d.k === 'remind') p.remindedOn = todayK(); commit(); setTimeout(closeSheet, 400); return; }

  case 'newcar': { closeSheet(); const open = givingCar(); if (open) return openClose(open.id, {thenNew: true}); return startWizard(); }

  case 'smstoggle': SMS.on = !SMS.on; if (SMS.on) { SMS.since = nowIso(); SMS.err = ''; SMS.cors = null; } smsSave(); render(); if (SMS.on) smsSoon(1000); return;
  case 'smstest': { if (!SMS.key || !SMS.from) return toast('Add the key and the sender name first'); const sent = smsSend(S.settings.momo, `StallBook test. Receipts will come from ${SMS.from}.`);
    toast('Sending a test…'); sent.then(r => { const el = document.getElementById('sms_status'); toast(r === 'ok' ? 'Test sent. Check your phone.' : r.err ? 'Not sent: ' + r.err : 'No signal. Try again.'); if (el) el.textContent = smsStatus(); }); return; }
  case 'togglevoice': S.settings.voice = !S.settings.voice; commit(); say('Speak is on.'); return render();
  case 'togglesound': S.settings.sound = S.settings.sound === false; commit(); if (S.settings.sound) sfx('cash'); return render();
  case 'togglehalf': S.settings.half = S.settings.half === false; commit(); return render();
  case 'setupdone': S.setup = true; commit(); return toRoot('give');
  case 'backupsheet': return backupSheet();
  case 'backup': closeSheet(); return doBackup();
  case 'restore': { const rf = document.getElementById('restorefile'); if (rf) rf.click(); return; }
  case 'restoreyes': { if (V.restorePhotos) { Object.keys(V.restorePhotos).forEach(id => { if (/^data:image\//.test(V.restorePhotos[id])) phPut(id, V.restorePhotos[id]); }); V.restorePhotos = null; } if (V.restoreData) { S = V.restoreData; S.lastBackup = nowIso(); commit(); V.restoreData = null; } closeSheet(); toast('Your book is back'); return toRoot('give'); }
  case 'wipe': return sheet(`<h3>Delete everything?</h3><p>This cannot be reversed. Back up first if you are not sure.</p><div class="bar"><button class="btn ghost" data-act="sheetclose">Keep</button><button class="btn danger" data-act="wipeyes">Delete</button></div>`);
  case 'wipeyes': S = blank(); commit(); closeSheet(); toRoot('give'); return push({v: 'setup'});
  case 'reload': location.reload(); return;
  case 'installok': lsSet('stallbook_install_hint', '1'); return closeSheet();
  case 'installhelp': return installSheet();
  case 'celclose': { const c = layer.querySelector('.celebrate'); if (c) c.remove(); return; }
  case 'demo': closeSheet(); V.realS = S; V.demo = true; S = demoData(); VER++; V.fTown = ''; V.fLoc = ''; return toRoot('give');
  case 'leavedemo': S = V.realS; V.realS = null; V.demo = false; VER++; V.fTown = ''; V.fLoc = ''; closeSheet(); hideToast(); toRoot('give'); if (!S.setup && !S.people.length && !S.cars.length) push({v: 'setup'}); return;
  }
}

/* hold ⌫ to clear the whole sum */
let delHold = 0, delHeld = false;
document.addEventListener('pointerdown', e => {
  const k = e.target.closest && e.target.closest('.key'); if (!k) return;
  delHeld = false; clearTimeout(delHold);
  if (k.dataset.k === 'del') delHold = setTimeout(() => { delHeld = true; k.classList.add('cleared'); sfx('clear'); act('key', {k: 'c'}); }, 550);
  else if (k.dataset.act === 'key') sfx('key');
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(delHold)));
let holdT = 0, holdFired = false;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-hold]'); if (!h || h.disabled) return;
  holdFired = false; clearTimeout(holdT); const ms = Number(h.dataset.ms) || 650; h.style.setProperty('--hold', ms + 'ms'); h.classList.add('holding');
  holdT = setTimeout(() => { h.classList.remove('holding'); holdFired = true; buzz(20); act(h.dataset.hold, Object.assign({}, h.dataset), h); }, ms);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  clearTimeout(holdT); document.querySelectorAll('.holding').forEach(x => x.classList.remove('holding'));
  if (holdFired) setTimeout(() => { holdFired = false; }, 60);
}));
document.addEventListener('touchstart', () => {}, {passive: true}); /* lets iPhone show the pressed colour */
document.addEventListener('click', e => {
  const t = e.target;
  if (delHeld && t.closest && t.closest('[data-k="del"]')) { delHeld = false; return; }
  if (holdFired) { holdFired = false; return; } /* the click that ends a hold does nothing more */
  if (t.classList && t.classList.contains('ov')) { if (V.sheetKind === 'proof') return proofDone(); closeSheet(); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  if (b.tagName !== 'A') e.preventDefault();
  act(b.dataset.act, Object.assign({}, b.dataset), b);
});

/* ---------- fit the screen ----------
   --s sizes the whole app: 1 on an iPhone 12, up to 1.35 on tablets and computers (bigger and more rows), down to .8 on small phones.
   The app itself always fills the screen by CSS. The script only sets the scale and, while the keyboard is open, the visible height. */
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const FIT = {w: 0, h: 0};
function fit() {
  const root = document.documentElement, vv = window.visualViewport;
  const w = window.innerWidth, h = window.innerHeight;
  /* the keyboard shrinks the height on a touch screen: while a text box is being typed in, keep the tallest height seen
     so the keyboard never resizes the app. Any other change of height (the address bar, split screen) is real. */
  const ed = document.activeElement, typing = !!ed && (ed.tagName === 'TEXTAREA' || ed.tagName === 'SELECT' || (ed.tagName === 'INPUT' && !/^(button|checkbox|radio|file|submit)$/.test(ed.type)));
  FIT.h = !COARSE || !typing || w !== FIT.w ? h : Math.max(FIT.h, h); FIT.w = w;
  const sc = Math.min(1.35, Math.max(0.8, Math.min(w / 390, FIT.h / 640)));
  root.style.setProperty('--s', sc.toFixed(3));
  root.classList.toggle('short', FIT.h / sc < 700);
  const vh = vv ? vv.height : h;
  const kb = COARSE && typing && FIT.h - vh > 120;
  root.style.setProperty('--app-h', Math.round(vh) + 'px');
  root.style.setProperty('--app-top', Math.round(vv ? vv.offsetTop : 0) + 'px');
  root.classList.toggle('kb', kb);
  if (kb && window.scrollY) window.scrollTo(0, 0);
}
fit();
['resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, fit));
if (window.visualViewport) ['resize', 'scroll'].forEach(ev => window.visualViewport.addEventListener(ev, fit));
document.addEventListener('focusout', () => setTimeout(fit, 350));
window.addEventListener('pageshow', () => setTimeout(fit, 50));

/* ---------- start ---------- */
if (S.migrated) { delete S.migrated; commit(); setTimeout(() => toast('Your book from version 1 is here. Nothing was lost.'), 500); }
else if (S.upgraded) { delete S.upgraded; save(); }
if (!givingCar() && debtors().some(x => x.st.sev >= 3)) V.tab = 'collect';
try { history.replaceState({root: 1}, ''); history.pushState({g: 1}, ''); } catch (e) {}
if (!S.setup && !S.people.length && !S.cars.length) { V.stack = [{v: 'setup'}]; try { history.pushState({d: 1}, ''); } catch (e) {} }
render();
smsSoon(4000);
phLoadAll().then(() => { if (Object.keys(PH).length) render(); });
/* ask the phone not to clear the book when it runs low on space */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* in Safari, explain once how to put the app on the Home Screen, where the book lives */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function installSheet() {
  sheet(`<i class="grab"></i><h3>Put StallBook on your Home Screen</h3>
    <ol class="steps3"><li>Tap the <b>Share</b> button in Safari.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open StallBook from the new icon.</li></ol>
    <p>It then opens full screen, like an app. Always use the icon: a book started in Safari stays in Safari.</p>
    <button class="btn ink tall" data-act="installok">Got it</button>`);
}
if (IOS && !STANDALONE && /^https?:$/.test(location.protocol) && !lsGet('stallbook_install_hint')) setTimeout(installSheet, 600);

</script>
