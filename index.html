<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#24307A">
<meta name="description" content="A credit book for market traders: give bags, collect money, never miss a debt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>StallBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* StallBook v3. Rule for every screen: look at the top, read the middle, touch the bottom. Give and Collect never leave the list. */
:root{
  --paper:#FFFFFF;--page:#E4E8F0;--rule:#CBDAEE;--margin:#E0545A;--ink:#24307A;--text:#1A1D26;--muted:#555B69;--faint:#6F7585;
  --owe:#BE2329;--owe-bg:#FDECEC;--paid:#17703F;--paid-bg:#E3F3E9;--warn:#7A4E00;--warn-bg:#FFEFC7;--held:#B76E00;
  --on-btn:#FFFFFF;--key:#ECEFF5;--key-text:#1A1D26;--line:#DFE3EC;--sheet:#FFFFFF;--shade:rgba(5,8,18,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171A23;--page:#0B0D12;--rule:#283450;--margin:#A33C43;--ink:#B4C0FF;--text:#ECEEF4;--muted:#A9AFBE;--faint:#8A90A1;
    --owe:#FF8086;--owe-bg:#3A1A1E;--paid:#62D69A;--paid-bg:#14301F;--warn:#FFD27A;--warn-bg:#382B0D;--held:#FFB547;
    --on-btn:#0D0F15;--key:#252935;--key-text:#ECEEF4;--line:#2B303E;--sheet:#1B1E28;--shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171A23;--page:#0B0D12;--rule:#283450;--margin:#A33C43;--ink:#B4C0FF;--text:#ECEEF4;--muted:#A9AFBE;--faint:#8A90A1;
  --owe:#FF8086;--owe-bg:#3A1A1E;--paid:#62D69A;--paid-bg:#14301F;--warn:#FFD27A;--warn-bg:#382B0D;--held:#FFB547;
  --on-btn:#0D0F15;--key:#252935;--key-text:#ECEEF4;--line:#2B303E;--sheet:#1B1E28;--shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
#shell{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--paper);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:600px) and (min-height:660px){body{display:flex;align-items:center;justify-content:center}#shell{width:400px;height:min(860px,calc(100% - 32px));border:10px solid #1C1E25;border-radius:44px;margin:0;flex:none}}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#layer{position:absolute;inset:0;pointer-events:none;z-index:30}
#layer>*{pointer-events:auto}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top: look */
.top{flex:none;padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:8px;min-width:0}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--key);color:var(--ink);font-weight:700;font-size:15px;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.ib.faint{color:var(--faint)}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--paper)}
.title{flex:1;min-width:0}
.title b{display:block;font-size:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;font-size:20px;font-weight:700;color:var(--ink)}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .n{font-size:52px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hero .n.owe{color:var(--owe)}.hero .n.ok{color:var(--paid)}
.hero .l{font-size:15px;color:var(--muted);margin-top:2px}
.hero .s{font-size:13px;color:var(--faint);margin-top:2px}
.split{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.split b{color:var(--text)}.split .w b{color:var(--warn)}.split .g b{color:var(--paid)}
.pulse{animation:tick .4s ease-out}
@keyframes tick{0%{transform:scale(1.2)}100%{transform:scale(1)}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.chip.dash{border-style:dashed}

/* middle: read */
.mid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none}
.mid::-webkit-scrollbar{display:none}
.mid.book{background:linear-gradient(to right,transparent 27px,var(--margin) 27px,var(--margin) 29px,transparent 29px) var(--paper);border-top:1.5px solid var(--rule)}
.mid.plain{border-top:1.5px solid var(--line)}
.mid.center{padding:12px;gap:10px}
.mid.center::before{content:"";flex:1 1 auto}
.mid.run{background:var(--page);padding:12px}
.mid.run::before,.mid.run::after{content:"";flex:1 1 auto}
.enter{animation:enter .16s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lines{margin-top:auto}
.lines.down{margin-top:0}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 12px 8px 40px;border-bottom:1.5px solid var(--rule);text-align:left;position:relative}
.row .who{flex:1;min-width:0;text-align:left}
.row.wait{background:var(--warn-bg)}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
.row.gone .who,.row.gone .amt{text-decoration:line-through;color:var(--faint)}
.name{font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:16px;color:var(--text)}
.amt{font-size:18px;font-weight:700;color:var(--owe);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.amt.ink{color:var(--ink)}.amt.ok{color:var(--paid)}.amt.faint{color:var(--faint);font-weight:400;font-size:15px}
.amt small{display:block;font-size:12px;font-weight:400;color:var(--faint)}
.d{flex:none;width:46px;font-size:13px;color:var(--faint)}
.mk{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:18px;text-align:center;font-weight:700;font-size:16px}
.mk.ok{color:var(--paid)}.mk.w{color:var(--warn)}.mk.r{color:var(--owe)}
.takebtn{flex:none;min-height:46px;padding:0 14px;border-radius:12px;background:var(--owe);color:var(--on-btn);font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
.sect{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px 6px 40px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:1.5px solid var(--rule)}
.sect span{flex:1}
.sect.w{color:var(--warn)}
.sect .mini{padding:7px 12px;border-radius:9px;background:var(--key);color:var(--ink);font-size:14px}
.endrow{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:10px 12px 10px 40px;font-size:15px;font-weight:700;color:var(--muted);text-align:left}
.empty{padding:28px 18px 24px 40px;color:var(--muted)}
.empty h2{margin:0 0 4px;font-size:20px;color:var(--ink)}
.empty p{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--key);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.ok{background:var(--paid-bg);color:var(--paid)}.tag.w{background:var(--warn-bg);color:var(--warn)}.tag.r{background:var(--owe-bg);color:var(--owe)}
.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tags.l{justify-content:flex-start}
.owes{text-align:center;display:flex;flex-direction:column;align-items:center}
.owes small{font-size:14px;color:var(--muted)}
.owes b{font-size:44px;line-height:1.05;color:var(--owe);font-variant-numeric:tabular-nums}
.owes b.ok{color:var(--paid);font-size:30px}
.owes span{font-size:14px;color:var(--muted)}
.showher{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 14px;border-radius:999px;background:var(--key);color:var(--ink);font-weight:700;font-size:14px}

/* bottom: touch */
.dock{flex:none;padding:8px 12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--paper);position:relative;z-index:5}
.dock.last{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;gap:8px;align-items:stretch}
.lh .bar{flex-direction:row-reverse}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 12px;border-radius:14px;font-size:17px;font-weight:700;text-align:center;min-width:0;line-height:1.15}
.btn small{display:block;font-size:12px;font-weight:400;opacity:.85}
.btn.tall{min-height:64px;font-size:19px}
.btn.give{background:var(--owe);color:var(--on-btn)}
.btn.take{background:var(--paid);color:var(--on-btn)}
.btn.ink{background:var(--ink);color:var(--on-btn)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn.call{background:var(--paid-bg);color:var(--paid)}
.btn.msg{background:var(--key);color:var(--ink)}
.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.redtext{color:var(--owe)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sq{flex:none;width:58px;min-height:56px;border-radius:14px;border:1.5px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sq small{font-size:11px;font-weight:700}
.sq.cash{color:var(--paid)}
.sq.call{border:0;background:var(--paid-bg);color:var(--paid)}
.sq.msg{border:0;background:var(--key)}
.sq[disabled]{opacity:.4;pointer-events:none}
.find{flex:1;display:flex;align-items:center;gap:8px;min-height:56px;padding:0 6px 0 14px;border-radius:14px;border:2px solid var(--owe);background:var(--owe-bg);color:var(--owe);min-width:0;cursor:text}
.find input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;font-weight:700;color:var(--text);padding:12px 0}
.find input::placeholder{color:var(--owe);opacity:.9}
.find.ink{border-color:var(--ink);background:var(--paper);color:var(--ink)}
.find.ink input::placeholder{color:var(--faint);font-weight:400}
.faces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.faces::-webkit-scrollbar{display:none}
.face{flex:none;display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--ink);min-height:42px}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--key);color:var(--ink)}
.av.lg{width:46px;height:46px;font-size:16px}
.av.xl{width:72px;height:72px;font-size:25px}
.strip{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:15px;text-align:left}
.strip span{flex:1}
.suggest{position:absolute;left:0;right:0;bottom:100%;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -10px 24px rgba(0,0,0,.14);max-height:min(330px,52vh);overflow-y:auto;display:flex;flex-direction:column-reverse;z-index:6}
.sg{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 14px;border-top:1px solid var(--line);text-align:left}
.sg .who{flex:1;min-width:0}
.sg.new .name{color:var(--owe)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:13px;font-weight:700;color:var(--faint);position:relative;text-align:center}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:10px;background:var(--owe);color:var(--on-btn);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* keypad and money */
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.key{min-height:54px;border-radius:13px;background:var(--key);color:var(--key-text);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.key.op{background:var(--paid-bg);color:var(--paid)}
.kp.pay .key{min-height:50px}
.notes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.note{min-height:42px;border-radius:9px;border:1.5px dashed var(--paid);background:var(--paid-bg);color:var(--paid);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.disp{padding:10px 14px;border-radius:16px;background:var(--key);text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.disp .tape{font-size:15px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-height:20px}
.disp .tape::-webkit-scrollbar{display:none}
.disp .v{font-size:42px;font-weight:700;line-height:1.1;color:var(--ink);word-break:break-all}
.disp .v.g{color:var(--paid)}
.disp .s{font-size:14px;color:var(--muted);min-height:19px}
.clears{font-size:14px;color:var(--muted);text-align:center;min-height:19px}
.clears b{color:var(--paid)}
.err{color:var(--owe);font-size:14px;min-height:19px;text-align:center}
.q{font-size:26px;font-weight:700;color:var(--ink);text-align:center;line-height:1.25}
.qs{font-size:15px;color:var(--muted);text-align:center}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--key)}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted);text-align:center;padding:0 6px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on.w{background:var(--warn-bg);color:var(--warn)}
.step{display:flex;align-items:center;justify-content:center;gap:18px}
.step .key{width:64px;min-height:64px;border-radius:50%;font-size:32px}
.step .num{min-width:92px;text-align:center;font-size:52px;font-weight:700;line-height:1;color:var(--ink)}
.step .num small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.halfbtn{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;color:var(--ink);font-size:15px}
.halfbtn.on{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.total{font-size:14px;color:var(--muted);text-align:right}
.total b{font-size:22px;color:var(--owe);margin-left:4px}
.total button{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* sheets, toasts */
.ov{position:absolute;inset:0;background:var(--shade);display:flex;align-items:flex-end;animation:fade .15s ease-out;z-index:35}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.ov.still,.ov.still .sheet{animation:none}
.grab{display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 0}
.sheet h3{margin:0;font-size:21px;color:var(--ink)}
.sheet p{margin:0;color:var(--muted)}
.sheet .center{text-align:center}
.small{font-size:13px;color:var(--faint)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--text);color:var(--paper);font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:pop .17s ease-out;z-index:40}
.toast span{flex:1;padding:4px 0}
.toast.in-dock{position:static;box-shadow:none}
.toast.still{animation:none}
.toast button,.toast a{flex:none;font-weight:700;padding:9px 12px;border-radius:10px;background:var(--paper);color:var(--text);font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;color:var(--muted)}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:18px;min-height:52px;outline:none}
.field input:focus{border-color:var(--ink)}
.msgprev{padding:12px 14px;border-radius:14px;background:var(--key);font-size:15px;line-height:1.45;color:var(--text)}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.datebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;border-radius:14px;border:1.5px solid var(--line);color:var(--ink)}
.datebtn b{font-size:18px}.datebtn small{font-size:13px;color:var(--faint)}
.datebtn.on{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.datebtn.on small{color:var(--on-btn);opacity:.8}
.cs-amt{font-size:46px;font-weight:700;color:var(--paid);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.cs-left{text-align:center;font-size:18px;color:var(--muted)}
.cs-left b{color:var(--owe);font-size:22px}
.stamp{align-self:center;margin:4px 0;border:4px solid var(--paid);color:var(--paid);font-size:30px;font-weight:700;padding:2px 18px;border-radius:10px;transform:rotate(-6deg);letter-spacing:3px;animation:slam .38s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-16deg);opacity:0}60%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.coin{position:absolute;z-index:45;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E2A814 60%,#B47F00);color:#6E4A00;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:coinfly 1.1s cubic-bezier(.2,.7,.3,1) both}
@keyframes coinfly{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.celebrate{position:absolute;inset:0;z-index:44;background:var(--shade);display:flex;align-items:center;justify-content:center;animation:fade .2s ease-out}
.cel-card{background:var(--sheet);border-radius:24px;padding:26px 22px 18px;width:84%;text-align:center;display:flex;flex-direction:column;gap:8px;animation:pop .32s cubic-bezier(.3,1.5,.5,1)}

<script>
'use strict';
/*
  StallBook v3: a credit book for market traders.
  One file, works offline, data stays on this phone (back it up to WhatsApp).
  Give and Collect never leave the list. Book is where you look things up.

  Data (saved under 'stallbook_v2'; older books are upgraded when they load):
    locs     towns and spots {id, town, spot}; spot '' means the whole town
    people   name, phone, loc (where she sells now), note (landmark)
    cars     one per delivery: label, items (product or size, count, price), costs, phase giving|out
    entries  append-only book lines; nothing is overwritten:
      give    bags for a customer, with the spot it happened at (loc).
              off = when the bags left the vehicle; null = held for her
      hand    held bags handed over (ref = the give, by = who collected)
      pay     money in (cash or momo); with = the give she paid for on the spot
      back    bags brought back against a give
      cash    bags sold for cash to nobody in particular
      stock   bags in or out of a delivery: count fixed, kept for next, sent back, spoiled
      move    she now sells somewhere else (from, to)
      promise she said she will pay on a day
      note    kind 'refused'
      undo    crosses out a line (kind: release, fix). An undo can itself be undone.
*/

const KEY = 'stallbook_v2', V1KEY = 'stallbook_v1';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NOTES = [200, 100, 50, 20, 10, 5];

const IC = {

  down:'<path d="M6 9l6 6 6-6"/>', check:'<path d="M5 12l5 5 9-10"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  msg:'<path d="M4 5h16v11H9l-5 4z"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  bag:'<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  ret:'<path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  del:'<path d="M20 6H9l-5 6 5 6h11z"/><path d="M13 10l4 4M17 10l-4 4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 4v10"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  cloud:'<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/>',
  cloudok:'<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/><path d="M9.5 13.5l2 2 3.5-4"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'
};
const svg = (n, s) => `<svg class="i"${s ? ` style="width:${s}px;height:${s}px"` : ''} viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const nowIso = () => new Date().toISOString();
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
function dayKey(d) { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayK = () => dayKey();
function kDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDaysK(k, n) { const d = kDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
function diffK(a, b) { return Math.round((kDate(a) - kDate(b)) / 864e5); }
function dmy(x) { const d = typeof x === 'string' && x.length === 10 ? kDate(x) : new Date(x); return d.getDate() + ' ' + MON[d.getMonth()]; }
function hm(x) { const d = new Date(x); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
function dayWord(k) { const n = diffK(k, todayK()); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; if (n > 1 && n < 7) return WD[kDate(k).getDay()] + ' ' + dmy(k); return dmy(k); }
function fmt(n) { const r = r2(n); return Math.abs(r).toLocaleString('en-US', {minimumFractionDigits: r % 1 ? 2 : 0, maximumFractionDigits: 2}); }
const money = n => (r2(n) < 0 ? '−' : '') + '₵' + fmt(n);
/* SMS text stays in the plain GSM alphabet (no ₵ or ½), so one message holds 160 letters instead of 70 and costs less. */
const smsMoney = n => 'GHS ' + fmt(n);
const unit = () => S.settings.unit || 'bag';
const Unit = () => unit()[0].toUpperCase() + unit().slice(1);
function bagsNum(n) { const w = Math.floor(n + 1e-9); const h = Math.abs(n - w - 0.5) < 0.01; return ((w ? String(w) : '') + (h ? '½' : '')) || '0'; }
function bagsTxt(n) { return bagsNum(n) + ' ' + unit() + (n > 1 || n === 0 ? 's' : ''); }
function smsBags(n) { const t = Math.round(n * 2) / 2; return (t % 1 ? t.toFixed(1) : String(t)) + ' ' + unit() + (t > 1 ? 's' : ''); }
const digits = p => String(p || '').replace(/\D/g, '');
function intl(p) { let d = digits(p); if (d.startsWith('00')) d = d.slice(2); if (d.length === 10 && d[0] === '0') d = '233' + d.slice(1); else if (d.length === 9) d = '233' + d; return d; }
function initials(n) { const p = String(n || '').trim().split(/\s+/); return (((p[0] || '?')[0] || '?') + (p[1] ? p[1][0] : '')).toUpperCase(); }
function shortName(n) { const p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[1][0] + '.' : p[0]; }
function similar(a, b) {
  a = a.toLowerCase().replace(/\s+/g, ''); b = b.toLowerCase().replace(/\s+/g, '');
  if (!a || !b) return false; if (a === b) return true; if (Math.min(a.length, b.length) < 4) return false;
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return false;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n] <= 2;
}

/* ---------- storage ---------- */
function blank() {
  return {v: 3, settings: {seller: '', momo: '', item: 'Onions', unit: 'bag', price: 650, cycle: 14, sound: true, hand: 'right', via: 'sms', half: true},
    locs: [], people: [], cars: [], entries: [], carry: 0, lastBackup: null, changedAt: null, lastLoc: '', setup: false};
}
/* Brings any older book up to v3. Safe to run on every load. */
function normalize(s) {
  const src = s || {};
  const o = Object.assign(blank(), src);
  o.settings = Object.assign(blank().settings, src.settings || {});
  ['locs', 'people', 'cars', 'entries'].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  const townLoc = name => { let l = o.locs.find(x => x.town.toLowerCase() === String(name).toLowerCase() && !x.spot); if (!l) { l = {id: uid(), town: String(name), spot: ''}; o.locs.push(l); } return l.id; };
  (Array.isArray(src.places) ? src.places : []).forEach(pl => { if (pl) townLoc(pl); });
  o.people.forEach(p => { if (!p.loc && p.place) p.loc = townLoc(p.place); delete p.place; if (p.note === undefined) p.note = ''; if (p.loc === undefined) p.loc = ''; });
  if (!o.lastLoc && src.lastPlace) o.lastLoc = townLoc(src.lastPlace);
  delete o.places; delete o.lastPlace;
  o.cars.forEach(c => {

function saveGive(force) {
  if (Date.now() - (V.lastSave || 0) < 800) return;
  const g = V.g; const car = carById(g.carId); const st = carStats(car.id);
  const item = car.items.find(i => i.id === g.itemId) || car.items[0];
  if (!force && g.bags > st.free + 1e-9) {
    V.sheetKind = 'over';
    sheet(`<h3>Only ${bagsTxt(Math.max(0, st.free))} left</h3><p>${st.wait ? `${bagsTxt(st.wait)} are held for other customers.` : 'Count the vehicle before you give more.'}</p><div class="bar"><button class="btn ghost" data-act="gback">Back</button><button class="btn danger" data-act="gforce">Give anyway</button></div>`);
    return;
  }
  let p = g.pid ? person(g.pid) : null;
  if (p && !p.phone && g.phone.trim()) p.phone = g.phone.trim();
  if (!p) {
    const name = g.name.trim();
    const ph = digits(g.phone);
    const m = !g.dupOk && S.people.find(x => (ph.length >= 9 && digits(x.phone).slice(-9) === ph.slice(-9)) || similar(x.name, name));
    if (m) {
      V.dupForce = force;
      sheet(`<h3>Same ${esc(m.name)}?</h3><p>Already in your book${m.loc ? ', ' + esc(locTxt(m.loc)) : ''}${m.phone ? ', ' + esc(m.phone) : ''}.</p><div class="bar"><button class="btn ghost" data-act="dupno">No, someone else</button><button class="btn ink" data-act="dupyes" data-id="${m.id}">Yes, same</button></div>`);
      return;
    }
    p = {id: uid(), name, phone: g.phone.trim(), loc: g.loc || '', note: '', created: nowIso()};
    S.people.push(p);
  }
  const moved = !!(p.loc && g.loc && p.loc !== g.loc);
  if (!p.loc && g.loc) p.loc = g.loc;
  if (g.loc) S.lastLoc = g.loc;
  const e = add({type: 'give', pid: p.id, carId: car.id, itemId: item.id, bags: g.bags, price: item.price, amount: r2(g.bags * item.price), loc: g.loc || '', off: g.hold ? null : nowIso(), rcpt: g.hold || g.cash ? true : !p.phone});
  if (g.cash) add({type: 'pay', pid: p.id, amount: e.amount, method: 'cash', with: e.id, loadId: e.id});
  V.lastSave = Date.now();
  closeSheet(); sfx(g.cash ? 'coin' : 'bag'); buzz(15); V.pulse = true; V.flash = e.id; render();
  const what = g.hold ? 'held' : g.cash ? 'paid cash' : 'given';
  toast(`${p.name} · ${bagsTxt(e.bags)} ${what}`, [{label: 'Undo', act: 'undo', id: e.id}, !g.hold && !g.cash && p.phone ? {label: 'Receipt', href: sendHref(p, receiptMsg(p, pendingReceipts(car.id).get(p.id) || [e])), act: 'rcpt', id: p.id} : null]);
  if (moved) askMoved(p.id, g.loc);
}

/* ===== Collect ===== */
function collectLists() {
  const q = V.cq.trim().toLowerCase();
  const all = debtors().filter(x => inFilter(x.p) && (!q || x.p.name.toLowerCase().includes(q)));
  const bySev = (a, b) => b.st.sev - a.st.sev || b.L.bal - a.L.bal;
  const now = all.filter(x => x.st.sev >= 3).sort(bySev);
  const prom = all.filter(x => x.st.k === 'promised').sort((a, b) => cmp(a.st.on, b.st.on));
  const later = all.filter(x => x.st.sev < 3 && x.st.k !== 'promised').sort((a, b) => cmp(a.st.due || '', b.st.due || ''));
  return {all, now, prom, later, order: [...now, ...prom, ...later]};
}
function collectListHtml() {
  const {all, now, prom, later} = collectLists();
  const t = todayK();
  const paysToday = S.entries.filter(e => e.type === 'pay' && live(e) && !e.with && dayKey(e.date) === t);
  const inToday = sum(paysToday, e => e.amount);
  const paidIds = [...new Set(paysToday.map(e => e.pid))].filter(id => { const p = person(id); return p && ledger(id).bal <= 0.001 && inFilter(p); });
  const fp = V.flashPay && Date.now() - V.flashPay.t < 4500 ? V.flashPay : null;
  const row = x => `<button class="row ${fp && fp.pid === x.p.id ? 'flash' : ''}" data-act="pay" data-id="${x.p.id}"><div class="who"><div class="name">${esc(x.p.name)}</div><div class="sub">${x.p.loc ? esc(locTxt(x.p.loc)) + ' · ' : ''}${statusTag(x.st)}</div></div><span class="amt">${money(x.L.bal)}${fp && fp.pid === x.p.id ? `<small class="ok">−${money(fp.amt)} ✓</small>` : ''}</span></button>`;
  const sect = (label, arr) => arr.length ? `<div class="sect"><span>${label} · ${arr.length}</span><span style="flex:none">${money(sum(arr, x => x.L.bal))}</span></div>` + arr.map(row).join('') : '';
  let mid = '';
  if (!all.length && !paidIds.length) mid += `<div class="empty"><h2>${V.cq || V.fTown ? 'Nobody here owes' : 'Nobody owes you'}</h2><p>${V.cq || V.fTown ? 'Try All, or check the spelling.' : 'Money given on credit shows up here.'}</p></div>`;
  mid += sect('Collect now', now) + sect('Promised', prom) + sect('Not due yet', later);
  if (paidIds.length) mid += `<div class="sect"><span>Paid today · ${paidIds.length}</span></div>` + paidIds.map(id => { const p = person(id); return `<button class="row paidtoday" data-act="person" data-id="${id}"><span class="mk ok">✓</span><div class="who"><div class="name">${esc(p.name)}</div><div class="sub">${esc(locTxt(p.loc))}</div></div><span class="amt ok">Paid ✓</span></button>`; }).join('');
  return {html: mid, all};
}

function remindList(ids) {
  const t = todayK();
  const pool = ids ? ids.map(id => ({p: person(id), st: status(id), L: ledger(id)})).filter(x => x.p && x.L.bal > 0.001) : debtors().filter(x => inFilter(x.p) && (x.st.sev >= 3 || x.st.k === 'soon'));
  return pool.filter(x => x.p.phone && x.p.remindedOn !== t).map(x => x.p.id);
}

/* money pad over the list: the calculator lives where money is typed */
const paySum = () => r2(sum([...V.pay.terms, V.pay.cur], x => Number(x) || 0));
function payPreview(pid, amt, loadId) {
  const open = ledger(pid).loads.filter(L => L.left > 0.001); const first = open.find(L => L.id === loadId);
  const order = (first ? [first] : []).concat(open.filter(L => L !== first)); let r = amt; const outp = [];
  for (const L of order) { if (r <= 0.001) break; const k = Math.min(L.left, r); r -= k; outp.push({L, k, cleared: k >= L.left - 0.001}); }
  return outp;
}
function openPay(pid, o) { V.pay = Object.assign({pid, terms: [], cur: '', method: 'cash', err: '', loadId: null, ctx: 'collect', over: ''}, o || {}); paySheet(); }
function nextPayId(pid) { const ord = collectLists().order.map(x => x.p.id); const i = ord.indexOf(pid); return ord.slice(i + 1).find(id => id !== pid) || null; }
function paySheet() {
  const P = V.pay; const p = person(P.pid); const L = ledger(p.id); const a = paySum(); const left = r2(L.bal - a);
  const tape = [...P.terms, P.cur].filter(Boolean);
  const over = a > Math.max(0, L.bal) + 0.001;
  const pv = payPreview(p.id, a, P.loadId);
  const next = P.ctx === 'collect' ? nextPayId(p.id) : null;
  sheet(`<div class="hrow"><span class="av">${esc(initials(p.name))}</span><div class="title"><b>${esc(p.name)}</b><small>${L.bal > 0.001 ? 'Owes ' + money(L.bal) : 'Owes nothing'}${p.loc ? ' · ' + esc(locTxt(p.loc)) : ''}</small></div>${L.bal > 0.001 ? `<button class="lnk" data-act="promise" data-id="${p.id}">Not today</button>` : ''}<button class="lnk" data-act="person" data-id="${p.id}">History ›</button></div>
    <div class="disp"><div class="tape">${tape.length > 1 ? tape.map(x => fmt(Number(x))).join(' + ') : '&nbsp;'}</div><div class="v ${a ? 'g' : ''}">${money(a)}</div><div class="s">${!a ? 'Tap the notes as she counts' : over ? money(a - Math.max(0, L.bal)) + ' more than she owes' : left > 0.001 ? money(left) + ' left after this' : 'All paid'}</div></div>
    ${over ? `<div class="over">What about the extra ${money(a - Math.max(0, L.bal))}?<div class="bar"><button class="chip ${P.over === 'credit' ? 'on' : ''}" data-act="pover" data-v="credit">Keep as credit</button><button class="chip ${P.over === 'change' ? 'on' : ''}" data-act="pover" data-v="change">Gave change</button></div></div>`
      : `<p class="clears">${a ? pv.map(x => x.cleared ? `Clears <b>${dmy(x.L.date)}</b>` : `${money(x.k)} off ${dmy(x.L.date)}`).join(', ') : '&nbsp;'}</p>`}
    <div class="seg mini2"><button class="${P.method === 'cash' ? 'on' : ''}" data-act="method" data-m="cash">Cash</button><button class="${P.method === 'momo' ? 'on' : ''}" data-act="method" data-m="momo">MoMo</button></div>
    <div class="notes">${NOTES.map(n => `<button class="note" data-act="note" data-n="${n}">${n}</button>`).join('')}</div>${keypad('pay')}
    ${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
    <div class="bar">${L.bal > 0.001 ? `<button class="btn ghost" data-act="payall">All ${money(L.bal)}</button>` : `<button class="btn ghost" data-act="sheetclose">Close</button>`}<button class="btn take" data-act="paydone">Done</button>${next ? `<button class="btn ghost" style="flex:.7" data-act="paynext" aria-label="Save and open the next customer">Next ›</button>` : ''}</div>`, 'pay');
  V.sheetKind = 'pay';
}
function payKey(k) {
  const P = V.pay;
  if (k === 'del') { if (P.cur) P.cur = P.cur.slice(0, -1); else P.terms.pop(); }
  else if (k === '+') { if (P.cur) { P.terms.push(P.cur); P.cur = ''; } }
  else { const n = (P.cur + k).replace(/^0+(?=\d)/, ''); if (n.length <= 7) P.cur = n; }
  P.err = ''; P.over = ''; paySheet();
}
/* saves the payment; returns false when something is missing */
function savePay() {
  const P = V.pay; const a = paySum(); const p = person(P.pid); const L = ledger(p.id);
  if (!a) { P.err = 'Type the money she gave first.'; paySheet(); return false; }
  const over = a > Math.max(0, L.bal) + 0.001;
  if (over && !P.over) { P.err = 'Choose what happens to the extra.'; paySheet(); return false; }
  const amount = over && P.over === 'change' ? Math.max(0, L.bal) : a;
  if (!amount) { P.err = 'She owes nothing. Keep it as credit, or give it back.'; paySheet(); return false; }
  const outBefore = new Map(S.cars.filter(c => c.phase === 'out').map(c => [c.id, carStats(c.id).out]));
  const e = add(Object.assign({type: 'pay', pid: p.id, amount, method: P.method, loadId: P.loadId || null, carId: null}, over && P.over === 'change' ? {change: r2(a - amount)} : {}));
  const bal = ledger(p.id).bal;
  sfx('cash'); buzz(25); if (bal <= 0.001) setTimeout(() => { sfx('thud'); coins(14); }, 250);
  const done = S.cars.find(c => c.phase === 'out' && outBefore.get(c.id) > 0.001 && carStats(c.id).out <= 0.001);
  if (done) setTimeout(() => celebrate(done), 900);
  V.flashPay = {pid: p.id, amt: amount, t: Date.now()};
  V.lastPay = {e, p, amount, bal};
  return true;
}
function payToast() { const {e, p, amount, bal} = V.lastPay; toast(`${p.name} paid ${money(amount)}`, [{label: 'Undo', act: 'undo', id: e.id}, p.phone ? {label: 'Receipt', href: sendHref(p, msgPay(p, amount, bal))} : null]); }
function celebrate(car) {
  sfx('win'); buzz([30, 60, 30, 60, 90]); coins(26);
  const o = document.createElement('div'); o.className = 'celebrate';
  o.innerHTML = `<div class="cel-card"><div class="cel-ic">✓</div><b>All collected</b><span>${esc(carName(car))} is fully paid.</span><button class="btn ink" data-act="celclose">Nice</button></div>`;
  layer.appendChild(o);
}

  V.sheetKind = 'promise';
}

function viewBook() {
  const all = debtors(); const out = sum(all, x => x.L.bal);
  const wk = new Date(Date.now() - 7 * 864e5).toISOString();
  const week = sum(S.entries.filter(e => e.type === 'pay' && live(e) && e.date >= wk), e => e.amount);
  const top = `<div class="hrow"><div class="brand">Book</div><button class="pill" data-act="mom">${svg('eye', 18)} Show Mom</button>${backupBtn()}${gearBtn()}</div>
    <div class="csum"><div class="cl"><small>Owed to you · ${all.length} ${all.length === 1 ? 'customer' : 'customers'}</small><b class="${out > 0.001 ? '' : 'ok'}">${money(out)}</b></div><div class="cr"><small>This week</small><b>${money(week)}</b></div></div>
    <div class="seg mini2"><button class="${V.bseg === 'people' ? 'on' : ''}" data-act="bseg" data-s="people">People</button><button class="${V.bseg === 'cars' ? 'on' : ''}" data-act="bseg" data-s="cars">Deliveries</button></div>
    ${V.bseg === 'people' ? filterChips(id => S.people.filter(p => p.loc === id).length) : ''}`;
  if (V.bseg === 'cars') {
    const cars = carsNewest();
    return {top, mid: `<div class="lines down">${cars.length ? cars.map(carRow).join('') : '<div class="empty"><h2>No deliveries yet</h2><p>Start one from Give.</p></div>'}</div>`, cls: 'book', dock: `<div class="bar"><button class="btn ink" data-act="newcar">${svg('truck')} New delivery</button></div>`, tabs: true, anchor: 'top'};
  }
  const dock = `<div class="bar"><label class="find ink">${svg('search')}<input id="bq" type="search" placeholder="Find a name or number" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Find a name or number" value="${esc(V.bq)}"></label><button class="sq" data-act="bsort" aria-label="Sort">${V.sort === 'az' ? 'A–Z' : '₵'}<small>sort</small></button><button class="sq" data-act="calc" aria-label="Calculator">${svg('calc')}</button></div>`;
  return {top, mid: `<div class="lines down" id="booklist">${bookList()}</div>`, cls: 'book', dock, tabs: true, anchor: 'top',
    after: () => { const i = document.getElementById('bq'); if (i) i.addEventListener('input', () => { V.bq = i.value; document.getElementById('booklist').innerHTML = bookList(); }); }};
}
function bookList() {
  const q = V.bq.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let ps = S.people.filter(p => inFilter(p) && (!q || p.name.toLowerCase().includes(q) || (qd.length >= 3 && digits(p.phone).includes(qd)) || locTxt(p.loc).toLowerCase().includes(q) || (p.note || '').toLowerCase().includes(q)));
  if (V.sort === 'az') ps.sort((a, b) => cmp(a.name.toLowerCase(), b.name.toLowerCase()));
  else ps.sort((a, b) => ledger(b.id).bal - ledger(a.id).bal || cmp(a.name, b.name));
  if (!ps.length) return `<div class="empty"><h2>${q || V.fTown ? 'Not found' : 'No names yet'}</h2><p>${q ? 'Check the spelling, or try her number.' : V.fTown ? 'Nobody here yet.' : 'Names are added when you give ' + esc(unit()) + 's.'}</p></div>`;
  return ps.map(p => { const L = ledger(p.id), st = status(p.id); const w = sum(L.waiting, e => e.bags);
    const where = [V.fLoc ? '' : locTxt(p.loc), p.note].filter(Boolean).join(' · ');
    return `<button class="row" data-act="person" data-id="${p.id}">${L.bal <= 0.001 && L.loads.length ? '<span class="mk ok">✓</span>' : ''}<div class="who"><div class="name">${esc(p.name)}</div><div class="sub">${where ? esc(where) + ' · ' : ''}${L.bal > 0.001 ? statusTag(st) : w ? `<span class="tag w">${bagsTxt(w)} held</span>` : 'Owes nothing'}</div></div>${L.bal > 0.001 ? `<span class="amt">${money(L.bal)}</span>` : ''}</button>`; }).join('');
}

/* ===== Her page: the full record ===== */
VIEWS.person = f => {
  const p = person(f.pid); if (!p) { pop(); return null; }
  const L = ledger(p.id), st = status(p.id), c = C();
  const heldBags = sum(L.waiting, e => e.bags);
  const tags = [L.bal > 0.001 ? statusTag(st) : '', recordTag(p.id), heldBags ? `<span class="tag w">${bagsTxt(heldBags)} held</span>` : ''].filter(Boolean);
  const top = `<div class="hrow"><span class="av lg">${esc(initials(p.name))}</span><div class="title"><b>${esc(p.name)}</b><small>${esc(p.phone) || 'No number yet'}</small></div><button class="ib" data-act="edit" data-id="${p.id}" aria-label="Edit name or number">${svg('edit')}</button></div>
    <button class="locchip" data-act="ploc" data-id="${p.id}">${svg('pin', 18)} ${p.loc ? esc(locTxt(p.loc)) : 'Where does she sell?'} ${svg('down', 16)}</button>${p.note ? `<div class="landmark">${esc(p.note)}</div>` : ''}
    <div class="owes">${L.bal > 0.001 ? `<small>Owes</small><b>${money(L.bal)}</b><div class="hrow" style="justify-content:center"><button class="showher" data-act="show" data-id="${p.id}">${svg('eye', 18)} Show her</button><button class="showher" data-act="promise" data-id="${p.id}">${svg('clock', 18)} Promise</button></div>` : `<small>${L.bal < -0.001 ? 'Credit' : 'Owes'}</small><b class="ok">${L.bal < -0.001 ? money(-L.bal) : 'Nothing'}</b>`}</div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}`;
  const lineDate = e => e.type === 'give' ? (givenAt(e) || e.date) : e.date;
  const lines = S.entries.filter(e => e.pid === p.id && ['give', 'pay', 'back', 'promise', 'note', 'move'].includes(e.type) && !(e.type === 'pay' && e.with)).sort((a, b) => cmp(lineDate(a), lineDate(b)));
  const line = e => {
    const gone = c.undone.has(e.id); const kind = gone ? undoKind(e.id) : '';
    let mk = '', t = '', sub = [], right = '';
    if (e.type === 'give') {
      const car = carById(e.carId); const ld = L.loads.find(x => x.id === e.id); const at = givenAt(e); const hand = c.hand.get(e.id); const old = e.fixes ? c.byId.get(e.fixes) : null;
      t = bagsTxt(e.bags) + (car ? ' · ' + (car.label || 'delivery ' + dmy(car.date)) : '');
      sub = [locTxt(e.loc), !at && !gone ? 'held since ' + hm(e.date) : '', hand ? 'handed over ' + hm(hand.date) + (hand.by ? ' to ' + hand.by : '') : '', e.by ? 'to ' + e.by : '', old ? 'corrected from ' + bagsNum(old.bags) : '', c.linked.has(e.id) ? 'paid cash' : '', gone ? (kind === 'fix' ? 'corrected' : kind === 'release' ? 'released' : 'removed') : ''];
      if (gone) right = '';
      else if (!at) { mk = `<span class="mk w">${svg('clock', 16)}</span>`; right = '<span class="tag w">Held</span>'; }
      else if (ld && ld.left <= 0.001) { mk = '<span class="mk ok">✓</span>'; right = '<span class="amt ok">Paid</span>'; }
      else right = `<span class="amt">${money(ld ? ld.left : e.amount)}<small>${ld && ld.left < e.amount - 0.001 ? 'of ' + money(e.amount) : 'left'}</small></span>`;
    } else if (e.type === 'pay') { t = 'Paid ' + money(e.amount); sub = [e.method === 'momo' ? 'MoMo' : 'cash', e.change ? 'gave ' + money(e.change) + ' change' : '']; right = gone ? '' : '<span class="amt ok">✓</span>'; }
    else if (e.type === 'back') { t = 'Brought back ' + bagsTxt(e.bags); right = `<span class="amt ok">−${money(e.amount)}</span>`; }
    else if (e.type === 'move') { t = 'Moved to ' + (locTxt(e.to) || 'no place'); sub = ['from ' + (locTxt(e.from) || 'no place'), e.mark || '']; }
    else if (e.type === 'promise') { const pr = L.proms.find(x => x.e.id === e.id); t = "Said she'll pay " + dayWord(e.on); sub = [e.how === 'momo' ? 'by MoMo' : '']; right = gone ? '' : pr && pr.kept ? '<span class="tag ok">Kept</span>' : pr && pr.broken ? '<span class="tag r">Broken</span>' : pr && pr.active ? '<span class="tag w">Waiting</span>' : '<span class="tag">Moved</span>'; }
    else if (e.type === 'note') { t = 'Refused to pay'; right = '<span class="tag r">Refused</span>'; }
    const s = sub.filter(Boolean).join(' · ');
    return `<button class="row ${gone ? 'gone' : ''}" data-act="${gone ? 'noop' : 'entry'}" data-id="${e.id}">${mk}<span class="d">${dmy(lineDate(e))}</span><div class="who"><div class="line">${esc(t)}</div>${s ? `<div class="sub wrap">${esc(s)}</div>` : ''}</div>${right}</button>`;
  };
  const mid = `<div class="lines">${lines.length ? lines.map(line).join('') : `<div class="empty"><p>Nothing in her book yet.</p></div>`}</div>`;
  const dock = `<div class="bar">${backSq()}${p.phone ? `<a class="btn call" href="tel:${esc(digits(p.phone))}" target="_top" data-act="noop">${svg('phone')} Call</a><button class="btn msg" data-act="msg" data-id="${p.id}">${svg('msg')} Message</button>` : `<button class="btn ghost" data-act="edit" data-id="${p.id}">${svg('phone')} Add her number</button>`}</div>
    <div class="bar"><button class="btn ink tall" data-act="give" data-id="${p.id}">${svg('bag')} Give</button><button class="btn take tall" data-act="paybook" data-id="${p.id}">${svg('cash')} Collect</button></div>`;
  return {top, mid, cls: 'book', dock, anchor: 'bottom'};
};
function backSheet(id) {

  const n = V.bk.n;
  sheet(`<i class="grab"></i><h3>How many did she bring back?</h3><p>From ${dmy(givenAt(e))}. Comes off what she owes: <b style="color:var(--paid)">${money(n * e.price)}</b></p>
    <div class="step"><button class="key" data-act="bkminus" aria-label="One less">−</button><div class="num">${bagsNum(n)}<small>${esc(unit())}${n > 1 ? 's' : ''}</small></div><button class="key" data-act="bkplus" aria-label="One more">+</button></div>

}
function editSheet(pid) {

function msgSheet(pid, kind) {

    <p class="small center">${esc(p.phone)}</p>`);
}
VIEWS.show = f => {

  return {top: `<div class="hrow"><span class="sp"></span></div>`,
    mid: `<div class="stmt"><div class="sn">${esc(p.name)}</div><div class="st">${L.bal > 0.001 ? 'owes' : 'owes nothing'}</div><div class="sv">${money(Math.max(0, L.bal))}</div>
      ${open.map(x => `<div class="sl"><span class="d">${dmy(x.date)}</span><span class="w">${bagsTxt(x.bags)}<small>at ${money(x.price)}${x.left < x.amount - x.backAmt - 0.01 ? ', part paid' : ''}</small></span><span class="a">${money(x.left)}</span></div>`).join('')}</div>`,
    cls: 'plain', dock: `<div class="bar"><button class="btn ink tall" data-act="back">Close</button></div>`};
};

/* ===== New delivery ===== */
function startWizard() { V.w = {s: 0, same: true, sub: 0, items: [], si: 0, tmp: '', err: '', label: ''}; push({v: 'newcar'}); }
VIEWS.newcar = () => {
  const W = V.w; const u = unit();
  const pad = (v, lab) => `<div class="disp"><div class="v">${v}${lab ? ` <span style="font-size:20px">${lab}</span>` : ''}</div></div>`;
  const step = n => `<div class="hrow"><div class="title"><b>New delivery</b><small>Step ${n} of 3</small></div></div>`;
  const shell = (n, q, sub, body, dock) => ({top: step(n), mid: `<div class="q">${q}</div>${sub ? `<div class="qs">${sub}</div>` : ''}${body || ''}<div class="err">${esc(W.err || '')}</div>`, cls: 'center plain', dock});
  if (W.s === 0) {
    const labels = [...new Set(carsNewest().map(c => c.label).filter(Boolean))].slice(0, 4);
    return Object.assign(shell(1, `All ${esc(u)}s the same?`, '', `<div class="field" style="text-align:left"><label for="w_label">Name this delivery (optional)</label><input id="w_label" value="${esc(W.label)}" autocomplete="off" placeholder="Where it came from, or the vehicle"></div>${labels.length ? `<div class="chips wrap" style="justify-content:center">${labels.map(l => `<button class="chip ${W.label === l ? 'on' : ''}" data-act="wlabel" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>` : ''}`,
      `<button class="btn ink tall" data-act="wsame">Yes, one kind</button><button class="btn ghost tall" data-act="wdiff">No, different sizes</button><div class="bar">${backSq('wback')}</div>`),
      {after: () => { const i = document.getElementById('w_label'); if (i) i.addEventListener('input', () => { V.w.label = i.value; }); }});
  }
  if (W.s === 1 && W.same) {
    if (W.sub === 0) return shell(2, `How many ${esc(u)}s?`, S.carry ? `${bagsNum(S.carry)} kept from the last delivery are included` : '', pad(esc(W.tmp) || '0', esc(u) + 's'), `${keypad('count')}<div class="bar">${backSq('wback')}<button class="btn ink" data-act="wnext">Next</button></div>`);
    return shell(2, `Price for one ${esc(u)}?`, '', pad(money(+W.tmp || 0)), `${keypad('money')}<div class="bar">${backSq('wback')}<button class="btn ghost" data-act="wlast">Same as last<br><small>${money(S.settings.price)}</small></button><button class="btn ink" data-act="wnext">Next</button></div>`);
  }
  if (W.s === 1) {
    const it = W.items[W.si];
    if (W.sub === 0) return shell(2, `Size ${W.si + 1}: what do you call it?`, '', '', `<div class="chips wrap" style="justify-content:center">${['Big', 'Medium', 'Small', 'Mini'].filter(n => !W.items.some((x, i) => i !== W.si && x.name === n)).map(n => `<button class="btn ghost tall" style="flex:1 1 40%" data-act="wname" data-n="${n}">${n}</button>`).join('')}</div><div class="bar">${backSq('wback')}</div>`);
    if (W.sub === 1) return shell(2, `How many ${esc(it.name)}?`, '', pad(esc(W.tmp) || '0', esc(u) + 's'), `${keypad('count')}<div class="bar">${backSq('wback')}<button class="btn ink" data-act="wnext">Next</button></div>`);
    if (W.sub === 2) return shell(2, `${esc(it.name)}: price for one?`, '', pad(money(+W.tmp || 0)), `${keypad('money')}<div class="bar">${backSq('wback')}<button class="btn ink" data-act="wnext">Next</button></div>`);
    return shell(2, 'Another size?', W.items.map(i => `${esc(i.name)}: ${bagsNum(i.count)} at ${money(i.price)}`).join('<br>'), '', `<button class="btn ghost tall" data-act="wmore">Yes, add a size</button><button class="btn ink tall" data-act="wdone">No, that's all</button><div class="bar">${backSq('wback')}</div>`);
  }
  const total = sum(W.items, i => i.count);
  return shell(3, 'What did the load cost you?', `${bagsTxt(total)}. Put the ${esc(S.settings.item || 'goods')}, transport and loading together. You can skip this.`, pad(money(+W.tmp || 0)), `${keypad('money')}<div class="bar">${backSq('wback')}<button class="btn ghost" data-act="wfinish" data-skip="1">Skip</button><button class="btn ink" data-act="wfinish">${svg('truck')} Start</button></div>`);
};
function wizBack() {
  const W = V.w; W.err = ''; W.tmp = '';
  if (W.s === 0) return pop();
  if (W.s === 2) { W.s = 1; W.sub = W.same ? 1 : 3; return render(); }
  if (W.same) { if (W.sub === 1) { W.sub = 0; W.tmp = String(W.items[0].count || ''); return render(); } W.s = 0; return render(); }
  if (W.sub > 0) { W.sub--; return render(); }
  if (W.si > 0) { W.items.pop(); W.si--; W.sub = 3; return render(); }
  W.s = 0; return render();
}

      <div class="disp"><div class="v">${N.mode === 'count' ? (esc(N.value) || '0') + ` <span style="font-size:20px">${esc(unit())}s</span>` : money(+N.value || 0)}</div></div><div class="err">${esc(N.err || '')}</div>`,

function openNum(o) { V.num = Object.assign({value: '', mode: 'money', err: ''}, o); push({v: 'num'}); }
function editNum(s, k, mode) { if (k === 'del') return s.slice(0, -1); if (k === '00' && !s) return s; const n = (s + k).replace(/^0+(?=\d)/, ''); return n.length > (mode === 'count' ? 4 : 7) ? s : n; }

/* ===== Delivery report and closing ===== */
const STOCK_WORD = {count: 'Count fixed', next: 'Kept for the next delivery', back: 'Sent back', bad: 'Spoiled or lost'};
VIEWS.report = f => {
  const car = carById(f.cid); if (!car) { pop(); return null; }
  const st = carStats(car.id);
  const hasCost = (car.costs || []).length > 0;
  const pct = st.credit > 0 ? Math.round(st.collected / st.credit * 100) : 0;
  const top = `<div class="hrow"><div class="title"><b>${esc(carName(car))}</b><small>${bagsTxt(st.loaded)} · ${car.phase === 'giving' ? 'open' : st.out > 0.001 ? 'collecting' : 'done'}</small></div><button class="ib" data-act="carmenu" data-id="${car.id}" aria-label="Delivery options">${svg('more')}</button></div>
    ${hasCost ? `<div class="hero"><div class="n ${st.profitNow >= 0 ? 'ok' : 'owe'}">${money(st.profitNow)}</div><div class="l">profit so far</div><div class="s">${money(st.profitAll)} when everyone pays</div></div>`
      : `<div class="hero"><div class="n ${st.out > 0.001 ? 'owe' : 'ok'}">${money(st.out)}</div><div class="l">still to collect</div><button class="showher" data-act="addcost" data-id="${car.id}">${svg('plus', 18)} Add what the load cost</button></div>`}`;
  const ln = (label, sub, amt, cls) => `<div class="row" style="min-height:52px"><div class="who"><div class="line">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div><span class="amt ${cls || ''}">${amt}</span></div>`;
  const people = st.people.map(id => { const p = person(id); const ls = ledger(id).loads.filter(x => x.carId === car.id); return {p, left: sum(ls, x => x.left), bags: sum(ls, x => x.bags - x.backBags), w: sum(ledger(id).waiting.filter(x => x.carId === car.id), x => x.bags)}; }).sort((a, b) => b.left - a.left);
  let mid = '<div class="lines down">';
  mid += (car.costs || []).map(x => ln(esc(x.name), '', '−' + money(x.amount), '')).join('');
  if (hasCost) mid += `<button class="endrow" data-act="addcost" data-id="${car.id}">${svg('plus', 18)} Add a cost</button>`;
  mid += ln(`${bagsTxt(st.loaded)} loaded`, `${bagsNum(st.given)} given · ${bagsNum(st.wait)} held · ${bagsNum(Math.max(0, st.free))} left`, '', '');
  mid += st.stock.map(e => ln(STOCK_WORD[e.reason] || 'Stock', dmy(e.date), (e.bags > 0 ? '+' : '−') + bagsNum(Math.abs(e.bags)), 'ink')).join('');
  if (st.cash) mid += ln(`${bagsTxt(st.cash)} sold for cash`, '', '+' + money(st.cashAmt), 'ok');
  mid += ln('Given on credit', bagsTxt(st.off), money(st.credit), 'ink');
  mid += ln('Collected so far', `${pct}% of credit`, '+' + money(st.collected), 'ok');
  mid += ln('Still out', `${people.filter(x => x.left > 0.001).length} customers`, money(st.out), '');
  if (people.length) mid += `<div class="sect"><span>Who took from this delivery</span></div>` + people.map(x => `<button class="row" data-act="person" data-id="${x.p.id}">${x.left <= 0.001 && !x.w ? '<span class="mk ok">✓</span>' : ''}<div class="who"><div class="name">${esc(x.p.name)}</div><div class="sub">${bagsTxt(x.bags)}${x.w ? ' · ' + bagsTxt(x.w) + ' held' : ''}</div></div>${x.left > 0.001 ? `<span class="amt">${money(x.left)}</span>` : x.w ? '' : '<span class="amt ok">Paid</span>'}</button>`).join('');
  mid += '</div>';
  const remN = remindList(people.filter(x => x.left > 0.001).map(x => x.p.id)).length;
  const dock = `${st.credit > 0 ? `<div class="sumline"><span>Credit collected</span><span>${pct}%</span></div><div class="prog"><i style="width:${pct}%"></i></div>` : ''}

/* ===== Calculator (on Book; Collect has its own money pad) ===== */
function calcEval(t) { t = t.slice(); while (t.length && !/^\d/.test(t[t.length - 1])) t.pop(); if (!t.length) return 0; const terms = []; let c = +t[0]; for (let i = 1; i < t.length; i += 2) { const op = t[i], n = +t[i + 1]; if (op === '*') c *= n; else { terms.push(c, op); c = n; } } terms.push(c); let r = terms[0]; for (let i = 1; i < terms.length; i += 2) r = terms[i] === '+' ? r + terms[i + 1] : r - terms[i + 1]; return r2(r); }
function calcSheet() {
  const c = V.calc || (V.calc = {t: [], done: false}); const sym = {'+': '+', '-': '−', '*': '×'};
  const expr = c.t.map(x => sym[x] || Number(x).toLocaleString('en-US')).join(' ');
  const k = (t, l, cls) => `<button class="key ${cls || ''}" data-act="ck" data-k="${t}">${l || t}</button>`;
  sheet(`<i class="grab"></i><div class="disp calcd"><div class="tape">${expr || '&nbsp;'}</div><div class="v">${c.done ? '= ' : ''}${fmt(calcEval(c.t))}</div></div>
    <div class="kp4">${k('7')}${k('8')}${k('9')}${k('*', '×', 'op')}${k('4')}${k('5')}${k('6')}${k('-', '−', 'op')}${k('1')}${k('2')}${k('3')}${k('+', '+', 'op')}${k('C', c.t.length && !c.done ? '⌫' : 'AC')}${k('0')}${k('00')}${k('=', '=', 'op')}</div>
    <button class="btn ghost" data-act="sheetclose">Close</button>`);
  V.sheetKind = 'calc';
}
function calcKey(t) {
  const c = V.calc; const isNum = x => /^\d/.test(x || ''); const last = c.t[c.t.length - 1];
  if (/^\d+$/.test(t)) { if (c.done) { c.t = []; c.done = false; } const L = c.t[c.t.length - 1]; if (isNum(L)) { const s = (L === '0' ? '' : L) + t; if (s.length <= 10) c.t[c.t.length - 1] = s.replace(/^0+(?=\d)/, '') || '0'; } else c.t.push(t === '00' ? '0' : t); }
  else if (t === 'C') { if (c.done || !c.t.length) { c.t = []; c.done = false; } else if (isNum(last)) { const s = last.slice(0, -1); if (s) c.t[c.t.length - 1] = s; else c.t.pop(); } else c.t.pop(); }
  else if (t === '=') { while (c.t.length && !isNum(c.t[c.t.length - 1])) c.t.pop(); if (c.t.length) c.done = true; }
  else { if (c.done) { c.t = [String(calcEval(c.t))]; c.done = false; } if (!c.t.length) c.t = ['0']; if (isNum(c.t[c.t.length - 1])) c.t.push(t); else c.t[c.t.length - 1] = t; }
  calcSheet();
}

/* ===== actions ===== */
function act(a, d, el) {
  d = d || {};
  switch (a) {
  case 'noop': return;
  case 'tab': V.tab = d.t; V.stack = []; V.qe = null; closeSheet(); hideToast(); return render();
  case 'back': return pop();
  case 'sheetclose': return closeSheet();
  case 'settings': return push({v: 'settings'});
  case 'person': closeSheet(); return push({v: 'person', pid: d.id});
  case 'show': return push({v: 'show', pid: d.id});
  case 'mom': return push({v: 'mom'});
  case 'report': closeSheet(); return push({v: 'report', cid: d.id});
  case 'carmenu': return carMenu(d.id);
  case 'gotogive': return toRoot('give');
  case 'bseg': V.bseg = d.s; return render();
  case 'bsort': V.sort = V.sort === 'az' ? 'owes' : 'az'; return render();
  case 'ftown': V.fTown = d.t; V.fLoc = ''; return render();
  case 'floc': V.fLoc = d.id; return render();

  /* give */
  case 'pick': return pickName(d.id || null, d.name || '');
  case 'give': closeSheet(); return openGive(d.id);
  case 'gq': { const half = Math.abs(V.g.bags % 1 - 0.5) < 0.01; V.g.bags = +d.n + (half ? 0.5 : 0); return giveSheet(); }
  case 'gqmore': V.qk = {v: V.g.bags > 6 ? String(Math.floor(V.g.bags)) : ''}; return qtySheet();
  case 'qtyback': return giveSheet();
  case 'qtyuse': { const n = parseInt(V.qk.v, 10); if (n > 0) V.g.bags = n; return giveSheet(); }
  case 'ghold': V.g.hold = !V.g.hold; return giveSheet();
  case 'gcash': V.g.cash = !V.g.cash; return giveSheet();
  case 'ghalf': V.g.bags = Math.abs(V.g.bags % 1 - 0.5) < 0.01 ? V.g.bags - 0.5 : V.g.bags + 0.5; if (V.g.bags < 0.5) V.g.bags = 0.5; return giveSheet();
  case 'gitem': V.g.itemId = d.i; return giveSheet();
  case 'gloc': return locSheet({mode: 'give', sel: V.g.loc});
  case 'gsave': return saveGive(false);
  case 'gforce': return saveGive(true);
  case 'gback': return giveSheet();
  case 'dupyes': V.g.pid = d.id; return saveGive(!!V.dupForce);
  case 'dupno': V.g.dupOk = true; return saveGive(!!V.dupForce);
  case 'mvyes': { const M = V.mv; movePerson(M.pid, M.loc); closeSheet(); render(); return toast('Her record now says ' + locTxt(M.loc)); }
  case 'mvno': return closeSheet();
  case 'cash': { const car = givingCar(); if (car.items.length > 1) return sheet(`<i class="grab"></i><h3>Sold for cash</h3><p>Which one?</p>${car.items.map(i => `<button class="btn ghost" data-act="cashitem" data-i="${i.id}">${esc(i.name)}</button>`).join('')}<button class="btn ghost" data-act="sheetclose">Cancel</button>`); return act('cashitem', {i: car.items[0].id}); }
  case 'cashitem': { const car = givingCar(); const it = car.items.find(i => i.id === d.i); closeSheet(); if (carStats(car.id).free < 1) return toast('No ' + unit() + 's left in the vehicle');
    const e = add({type: 'cash', pid: null, carId: car.id, itemId: it.id, bags: 1, price: it.price, amount: it.price}); sfx('coin'); buzz(15); V.pulse = true; render();
    return toast(`1 ${unit()} sold for cash`, [{label: 'Undo', act: 'undo', id: e.id}]); }
  case 'rcpt': markReceipts(d.id); hideToast(); return render();
  case 'receipts': { const car = givingCar(); const m = pendingReceipts(car ? car.id : null); V.queue = {kind: 'rcpt', ids: [...m.keys()], i: 0, carId: car ? car.id : null}; return queueStep(); }

  /* in-row correction */
  case 'qedit': { const e = byId(d.id); V.qe = {id: d.id, n: e.bags}; return render(); }
  case 'qminus': if (V.qe.n >= 1.5) V.qe.n -= 1; else if (V.qe.n > 0.5 && S.settings.half) V.qe.n = 0.5; return render();
  case 'qplus': V.qe.n = Math.min(999, V.qe.n + 1); return render();
  case 'qcancel': V.qe = null; return render();
  case 'qsave': { const Q = V.qe; V.qe = null; const e = byId(Q.id); if (!e || Q.n === e.bags) return render(); const n = fixGive(Q.id, {bags: Q.n}); const p = person(e.pid); V.flash = n.id; render(); return toast(`${p ? p.name : ''} · ${bagsNum(e.bags)} → ${bagsNum(Q.n)}`, [{label: 'Undo', act: 'unfix', id: n.id}]); }

  /* one line */
  case 'entry': V.es = null; return entrySheet(d.id);
  case 'esminus': if (V.es.n >= 1.5) V.es.n -= 1; return entrySheet(V.es.id);
  case 'esplus': V.es.n = Math.min(999, V.es.n + 1); return entrySheet(V.es.id);
  case 'eshalf': { const n = V.es.n; V.es.n = Math.abs(n % 1 - 0.5) < 0.01 ? n - 0.5 : n + 0.5; if (V.es.n < 0.5) V.es.n = 0.5; return entrySheet(V.es.id); }
  case 'essave': { const e = byId(V.es.id); const n = fixGive(V.es.id, {bags: V.es.n}); closeSheet(); V.flash = n.id; render(); return toast(`${bagsNum(e.bags)} → ${bagsNum(V.es.n)}`, [{label: 'Undo', act: 'unfix', id: n.id}]); }
  case 'eswho': return nameSheet(V.es.id);
  case 'esloc': { const e = byId(V.es.id); return locSheet({mode: 'entry', id: e.id, sel: e.loc}); }
  case 'nspick': { const e = byId(V.ns.id); let pid = d.id; if (!pid) { const p = {id: uid(), name: d.name.trim(), phone: '', loc: e.loc || '', note: '', created: nowIso()}; S.people.push(p); pid = p.id; }
    const from = person(e.pid), to = person(pid); const n = fixGive(e.id, {pid}); closeSheet(); V.flash = n.id; render();
    return toast(`${bagsTxt(e.bags)}: ${from ? from.name : '?'} → ${to.name}`, [{label: 'Undo', act: 'unfix', id: n.id}]); }
  case 'unfix': unfix(d.id); hideToast(); return render();
  case 'hand': { const e = byId(d.id); const by = ((document.getElementById('es_by') || {}).value || '').trim(); const [h] = handOver([e], by); const p = person(e.pid); closeSheet(); sfx('bag'); buzz(15); V.flash = e.id; render();
    return toast(`${p ? p.name : ''} · ${bagsTxt(e.bags)} handed over`, [{label: 'Undo', act: 'undo', id: h.id}, p && p.phone && !C().linked.has(e.id) ? {label: 'Receipt', href: sendHref(p, receiptMsg(p, [e])), act: 'rcpt', id: p.id} : null]); }
  case 'handall': { const car = carById(d.id) || givingCar(); const gs = heldOn(car.id); if (!gs.length) return; const hs = handOver(gs, ''); sfx('bag');
    if (V.sheetKind === 'close') { closeCarSheet(); render(); return; } closeSheet(); render(); return toast(`${bagsTxt(sum(gs, e => e.bags))} handed over`, [{label: 'Undo', act: 'undomany', id: hs.map(h => h.id).join(',')}]); }
  case 'release': { const e = byId(d.id); undoEntry(d.id, 'release'); closeSheet(); render(); return toast(`${bagsTxt(e.bags)} back in the vehicle`, [{label: 'Undo', act: 'revive', id: d.id}]); }
  case 'releaseall': { const gs = heldOn(d.id); gs.forEach(e => undoEntry(e.id, 'release')); if (V.sheetKind === 'close') { closeCarSheet(); render(); return; } closeSheet(); return render(); }
  case 'revive': revive(d.id); hideToast(); return render();
  case 'undomany': d.id.split(',').forEach(id => undoEntry(id)); hideToast(); return render();
  case 'undoask': { const e = byId(d.id); return sheet(`<h3>Remove this line?</h3><p>${dmy(givenAt(e) || e.date)}: ${bagsTxt(e.bags)}. It stays in her book, crossed out.</p><div class="bar"><button class="btn ghost" data-act="sheetclose">Keep it</button><button class="btn danger" data-act="undoit" data-id="${d.id}">Remove</button></div>`); }
  case 'undoit': undoEntry(d.id); closeSheet(); hideToast(); return render();
  case 'undo': undoEntry(d.id); hideToast(); return render();
  case 'backsheet': V.bk = null; return backSheet(d.id);
  case 'bkplus': V.bk.n = Math.min(V.bk.max, V.bk.n + 1); return backSheet(V.bk.id);
  case 'bkminus': V.bk.n = Math.max(0.5, V.bk.n - 1); return backSheet(V.bk.id);
  case 'bkhalf': { const n = V.bk.n; V.bk.n = Math.abs(n % 1 - 0.5) < 0.01 ? n - 0.5 : n + 0.5; V.bk.n = Math.min(V.bk.max, Math.max(0.5, V.bk.n)); return backSheet(V.bk.id); }
  case 'bksave': { const e = byId(V.bk.id); add({type: 'back', pid: e.pid, carId: e.carId, ref: e.id, bags: V.bk.n, price: e.price, amount: r2(V.bk.n * e.price)}); closeSheet(); render(); return toast(`${bagsTxt(V.bk.n)} brought back, ${money(V.bk.n * e.price)} off`); }

  /* places */
  case 'lstown': V.ls.town = d.t; V.ls.spot = ''; V.ls.adding = ''; return locSheet();
  case 'lsspot': V.ls.spot = d.s; return locSheet();
  case 'lsaddtown': V.ls.adding = 'town'; return locSheet();
  case 'lsaddspot': V.ls.adding = 'spot'; return locSheet();
  case 'lsadd': { const i = document.getElementById('ls_new'); const v = (i && i.value || '').trim(); if (!v) return; if (V.ls.adding === 'spot' && !V.ls.town) { V.ls.adding = 'town'; return locSheet(); } if (V.ls.adding === 'town') { const id = getLoc(v, ''); V.ls.town = locById(id).town; V.ls.spot = ''; } else { const id = getLoc(V.ls.town, v); V.ls.spot = locById(id).spot; } V.ls.adding = ''; commit(); return locSheet(); }
  case 'lssave': { const L = V.ls; if (!L.town) { if (L.mode === 'setup') { closeSheet(); return render(); } L.adding = 'town'; return locSheet(); }
    const id = getLoc(L.town, L.spot); commit();
    if (L.mode === 'give') { V.g.loc = id; return giveSheet(); }
    if (L.mode === 'entry') { const e = byId(L.id); if (e.loc === id) return closeSheet(); const n = fixGive(L.id, {loc: id}); closeSheet(); V.flash = n.id; render(); return toast(`Now ${locTxt(id)}`, [{label: 'Undo', act: 'unfix', id: n.id}]); }
    if (L.mode === 'person') { const p = person(L.pid); const before = p.loc; movePerson(L.pid, id, L.mark.trim()); closeSheet(); render(); return before !== id ? toast(`${p.name} now at ${locTxt(id)}`) : null; }
    closeSheet(); return render(); }
  case 'addloc': return locSheet({mode: 'setup', sel: ''});
  case 'ploc': { const p = person(d.id); return locSheet({mode: 'person', pid: p.id, sel: p.loc, mark: p.note || ''}); }

  /* collect */
  case 'pay': return openPay(d.id, {ctx: 'collect'});
  case 'paybook': return openPay(d.id, {ctx: 'person'});
  case 'payload': { const e = byId(d.id); closeSheet(); return openPay(e.pid, {loadId: d.id, ctx: 'person'}); }
  case 'note': { const P = V.pay; if (P.cur) { P.terms.push(P.cur); P.cur = ''; } P.terms.push(d.n); P.err = ''; P.over = ''; buzz(8); return paySheet(); }
  case 'method': V.pay.method = d.m; return paySheet();
  case 'pover': V.pay.over = d.v; V.pay.err = ''; return paySheet();
  case 'payall': { const b = ledger(V.pay.pid).bal; V.pay.terms = [String(b)]; V.pay.cur = ''; V.pay.err = ''; V.pay.over = ''; return paySheet(); }
  case 'paydone': { if (!savePay()) return; closeSheet(); render(); return payToast(); }
  case 'paynext': { const P = V.pay; const nx = nextPayId(P.pid); if (paySum() > 0) { if (!savePay()) return; } render(); if (V.lastPay && V.lastPay.p.id === P.pid && paySum() > 0) payToast(); if (!nx) return closeSheet(); return openPay(nx, {ctx: 'collect'}); }
  case 'promise': V.pr = null; return promiseSheet(d.id);
  case 'pron': V.pr.on = d.k; return promiseSheet(V.pr.pid);
  case 'prhow': V.pr.how = d.h; return promiseSheet(V.pr.pid);
  case 'prsave': { const P = V.pr; const p = person(P.pid); add({type: 'promise', pid: P.pid, on: P.on, how: P.how}); closeSheet(); render();
    return toast(`Promise saved: ${dayWord(P.on)}`, [p.phone ? {label: 'Send it to her', href: sendHref(p, msgPromise(p, P.on))} : null]); }
  case 'refused': { add({type: 'note', kind: 'refused', pid: V.pr.pid}); closeSheet(); render(); return toast('Marked as refused. She goes to the top of the list.'); }
  case 'remindall': { const ids = remindList(); const none = debtors().filter(x => !x.p.phone && x.st.sev >= 3 && inFilter(x.p)).map(x => x.p.name); V.queue = {kind: 'remind', ids, i: 0, none}; return queueStep(); }
  case 'remindcar': { const st = carStats(d.id); const owing = st.people.filter(id => ledger(id).loads.some(x => x.carId === d.id && x.left > 0.001)); V.queue = {kind: 'remind', ids: remindList(owing), i: 0, none: owing.filter(id => !person(id).phone).map(id => person(id).name)}; return queueStep(); }
  case 'qsent': { const Q = V.queue; if (Q.kind === 'rcpt') markReceipts(d.id); else { const p = person(d.id); p.remindedOn = todayK(); commit(); } setTimeout(() => { if (V.queue) { V.queue.i++; queueStep(); } }, 600); return; }
  case 'qskip': { const Q = V.queue; if (Q.kind === 'rcpt') markReceipts(Q.ids[Q.i]); Q.i++; return queueStep(); }
  case 'qstop': V.queue = null; closeSheet(); return render();
  case 'queuedone': closeSheet(); return render();

  /* keypads */
  case 'key': {
    if (V.sheetKind === 'pay') return payKey(d.k);
    if (V.sheetKind === 'qty') { V.qk.v = editNum(V.qk.v, d.k, 'count'); return qtySheet(); }
    const f = cur(); if (!f) return;
    if (f.v === 'num') { V.num.value = editNum(V.num.value, d.k, V.num.mode); V.num.err = ''; return render(); }
    if (f.v === 'newcar') { const W = V.w; const isMoney = W.s === 2 || (W.s === 1 && (W.same ? W.sub === 1 : W.sub === 2)); W.tmp = editNum(W.tmp, d.k, isMoney ? 'money' : 'count'); W.err = ''; return render(); }
    return; }
  case 'numchip': V.num.chip = d.c; return render();
  case 'numsave': { const N = V.num; const err = N.onSave(Number(N.value) || 0, N.chip); if (err) { N.err = err; return render(); } return pop(); }

  /* her page */
  case 'edit': return editSheet(d.id);
  case 'edsave': { const p = person(V.ed.pid); const name = document.getElementById('e_name').value.trim(); if (!name) { document.getElementById('e_err').textContent = 'Write her name.'; return; }
    p.name = name; p.phone = document.getElementById('e_phone').value.trim(); commit(); closeSheet(); return render(); }
  case 'msg': return msgSheet(d.id);
  case 'msgkind': return msgSheet(d.id, d.k);
  case 'msgsent': { const p = person(d.id); p.via = d.via; if (d.k === 'remind') p.remindedOn = todayK(); commit(); setTimeout(closeSheet, 400); return; }

  /* deliveries */
  case 'newcar': { closeSheet(); const open = givingCar(); if (open) return openClose(open.id, {thenNew: true}); return startWizard(); }
  case 'closecar': return openClose(d.id || givingCar().id);
  case 'clopt': V.cl.choice = d.k; return closeCarSheet();
  case 'cldo': return closeCar();
  case 'reopen': { const car = carById(d.id); const open = givingCar(); if (open && open.id !== car.id) { closeSheet(); return toast('Close the open delivery first'); }
    (car.closeIds || []).forEach(id => undoEntry(id)); if (car.closeCarry) S.carry = Math.max(0, (Number(S.carry) || 0) - car.closeCarry);
    car.closeIds = []; car.closeCarry = 0; car.phase = 'giving'; commit(); closeSheet(); toast(`${carName(car)} is open again`); return toRoot('give'); }
  case 'price': { const car = carById(d.id); closeSheet(); if (car.items.length > 1) return sheet(`<i class="grab"></i><h3>Which price?</h3>${car.items.map(i => `<button class="btn ghost" data-act="priceitem" data-id="${car.id}" data-i="${i.id}">${esc(i.name)} · ${money(i.price)}</button>`).join('')}`); return act('priceitem', {id: car.id, i: car.items[0].id}); }
  case 'priceitem': { const car = carById(d.id); const it = car.items.find(i => i.id === d.i); closeSheet();
    return openNum({title: `Price for one ${it.name ? it.name.toLowerCase() + ' ' : ''}${unit()}`, sub: 'From now on, for this delivery', mode: 'money', onSave: n => { if (!(n > 0)) return 'Type the price.'; it.price = n; S.settings.price = n; commit(); }}); }
  case 'label': closeSheet(); return labelSheet(d.id);
  case 'lbchip': { const i = document.getElementById('lb_in'); if (i) i.value = d.l; return; }
  case 'lbsave': { const car = carById(d.id); car.label = (document.getElementById('lb_in').value || '').trim(); commit(); closeSheet(); return render(); }
  case 'wlabel': V.w.label = d.l; return render();
  case 'fixcount': { const car = carById(d.id); closeSheet(); return openNum({title: `How many ${unit()}s are in the vehicle?`, sub: 'Count them, held ones included', mode: 'count', onSave: n => { const st = carStats(car.id); const diff = n - st.inCar; if (diff) add({type: 'stock', carId: car.id, bags: diff, reason: 'count'}); toast('Count fixed'); }}); }
  case 'addcost': { const car = carById(d.id); closeSheet(); return openNum({title: 'Add a cost', sub: carName(car), mode: 'money', chips: ['Load', 'Transport', 'Loading', 'Market toll', 'Other'], chip: (car.costs || []).length ? 'Transport' : 'Load', onSave: (n, chip) => { if (!(n > 0)) return 'Type the amount.'; car.costs = car.costs || []; car.costs.push({id: uid(), name: chip || 'Other', amount: n}); commit(); }}); }
  case 'wback': return wizBack();
  case 'wsame': Object.assign(V.w, {same: true, s: 1, sub: 0, items: [{id: uid(), name: '', count: 0, price: 0}], si: 0, tmp: S.carry ? String(S.carry) : '', err: ''}); return render();
  case 'wdiff': Object.assign(V.w, {same: false, s: 1, sub: 0, items: [{id: uid(), name: '', count: 0, price: 0}], si: 0, tmp: '', err: ''}); return render();
  case 'wname': V.w.items[V.w.si].name = d.n; V.w.sub = 1; V.w.tmp = ''; return render();
  case 'wmore': V.w.items.push({id: uid(), name: '', count: 0, price: 0}); V.w.si = V.w.items.length - 1; V.w.sub = 0; V.w.tmp = ''; return render();
  case 'wdone': V.w.s = 2; V.w.tmp = ''; return render();
  case 'wlast': V.w.items[0].price = Number(S.settings.price) || 0; V.w.s = 2; V.w.tmp = ''; return render();
  case 'wnext': { const W = V.w; const n = +W.tmp || 0; const it = W.items[W.si]; W.err = '';
    if ((W.sub === 0 && W.same) || (W.sub === 1 && !W.same)) { if (!(n > 0)) { W.err = 'Type how many.'; return render(); } it.count = n; W.sub = W.same ? 1 : 2; W.tmp = ''; return render(); }
    if (!(n > 0)) { W.err = 'Type the price.'; return render(); }
    it.price = n; W.tmp = ''; if (W.same) W.s = 2; else W.sub = 3; return render(); }
  case 'wfinish': { const W = V.w; const cost = d.skip ? 0 : +W.tmp || 0;
    const car = {id: uid(), date: nowIso(), label: (W.label || '').trim(), items: W.items.map(i => ({id: i.id, name: W.same ? '' : i.name, count: i.count, price: i.price})), costs: cost ? [{id: uid(), name: 'Load', amount: cost}] : [], phase: 'giving'};
    S.cars.push(car); S.carry = 0; S.settings.price = car.items[0].price; commit(); V.w = null; return toRoot('give'); }

  /* settings, backup */
  case 'setseg': S.settings[d.k] = d.v; commit(); return render();
  case 'togglesound': S.settings.sound = S.settings.sound === false; commit(); if (S.settings.sound) sfx('cash'); return render();
  case 'togglehalf': S.settings.half = S.settings.half === false; commit(); return render();
  case 'setupdone': S.setup = true; commit(); return toRoot('give');
  case 'backupsheet': return backupSheet();
  case 'backup': closeSheet(); return doBackup();
  case 'restore': { const rf = document.getElementById('restorefile'); if (rf) rf.click(); return; }
  case 'restoreyes': { if (V.restoreData) { S = V.restoreData; S.lastBackup = nowIso(); commit(); V.restoreData = null; } closeSheet(); toast('Your book is back'); return toRoot('give'); }
  case 'wipe': return sheet(`<h3>Delete everything?</h3><p>This cannot be undone. Back up first if you are not sure.</p><div class="bar"><button class="btn ghost" data-act="sheetclose">Keep</button><button class="btn danger" data-act="wipeyes">Delete</button></div>`);
  case 'wipeyes': S = blank(); commit(); closeSheet(); toRoot('give'); return push({v: 'setup'});
  case 'calc': return calcSheet();
  case 'ck': return calcKey(d.k);
  case 'celclose': { const c = layer.querySelector('.celebrate'); if (c) c.remove(); return; }
  case 'demo': closeSheet(); V.realS = S; V.demo = true; S = demoData(); VER++; V.fTown = ''; V.fLoc = ''; return toRoot('give');
  case 'leavedemo': S = V.realS; V.realS = null; V.demo = false; VER++; V.fTown = ''; V.fLoc = ''; closeSheet(); hideToast(); toRoot('give'); if (!S.setup && !S.people.length && !S.cars.length) push({v: 'setup'}); return;
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('ov')) { closeSheet(); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  if (b.tagName !== 'A') e.preventDefault();
  act(b.dataset.act, Object.assign({}, b.dataset), b);
});

/* ---------- start ---------- */
if (S.migrated) { delete S.migrated; commit(); setTimeout(() => toast('Your book from version 1 is here. Nothing was lost.'), 500); }
else if (S.v === 3 && S.entries.length) save();
if (!givingCar() && debtors().some(x => x.st.sev >= 3)) V.tab = 'collect';
try { history.replaceState({root: 1}, ''); history.pushState({g: 1}, ''); } catch (e) {}
if (!S.setup && !S.people.length && !S.cars.length) { V.stack = [{v: 'setup'}]; try { history.pushState({d: 1}, ''); } catch (e) {} }
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

</script>
</body>
</html>
