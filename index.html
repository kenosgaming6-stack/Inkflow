<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StallBook — version one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;--page:#E4E8F0;--rule:#CBDAEE;--margin:#E0545A;--ink:#24307A;--text:#1A1D26;--muted:#555B69;--faint:#7D8392;
  --owe:#BE2329;--owe-bg:#FDECEC;--paid:#17703F;--paid-bg:#E3F3E9;--warn:#7A4E00;--warn-bg:#FFEFC7;
  --btn:#24307A;--on-btn:#FFFFFF;--key:#ECEFF5;--key-text:#1A1D26;--line:#DFE3EC;--sheet:#FFFFFF;--orange:#A9480A;--orange-bg:#FFE6D1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171A23;--page:#0B0D12;--rule:#283450;--margin:#A33C43;--ink:#B4C0FF;--text:#ECEEF4;--muted:#A9AFBE;--faint:#7E8495;
    --owe:#FF8086;--owe-bg:#3A1A1E;--paid:#62D69A;--paid-bg:#14301F;--warn:#FFD27A;--warn-bg:#382B0D;
    --btn:#B4C0FF;--on-btn:#0D0F15;--key:#252935;--key-text:#ECEEF4;--line:#2B303E;--sheet:#1B1E28;--orange:#FFB37D;--orange-bg:#3A2312;
  }
}
:root[data-theme="dark"]{
  --paper:#171A23;--page:#0B0D12;--rule:#283450;--margin:#A33C43;--ink:#B4C0FF;--text:#ECEEF4;--muted:#A9AFBE;--faint:#7E8495;
  --owe:#FF8086;--owe-bg:#3A1A1E;--paid:#62D69A;--paid-bg:#14301F;--warn:#FFD27A;--warn-bg:#382B0D;
  --btn:#B4C0FF;--on-btn:#0D0F15;--key:#252935;--key-text:#ECEEF4;--line:#2B303E;--sheet:#1B1E28;--orange:#FFB37D;--orange-bg:#3A2312;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--page);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
#shell{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--paper);overflow:hidden}
@media (min-width:600px) and (min-height:620px){body{display:flex;align-items:center;justify-content:center}#shell{width:390px;height:min(844px,calc(100% - 32px));border:10px solid #1C1E25;border-radius:46px;flex:none;margin:0}}
#app{height:100%;display:flex;flex-direction:column}
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column}
.swipe{touch-action:pan-y}
.chip svg{vertical-align:-2px;margin-left:2px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:-2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.dk{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);background:var(--paper)}
.screen{animation:enter .16s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.brand{flex:1;font-size:20px;font-weight:700;color:var(--ink)}
.brand small{font-size:12px;font-weight:400;color:var(--faint);margin-left:4px}
.chip{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;background:var(--paid-bg);color:var(--paid);white-space:nowrap}
.chip.stale{background:var(--warn-bg);color:var(--warn)}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink);flex:none}
.ib.box{border:1.5px solid var(--line)}
.ib.fill{background:var(--key)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book{position:relative;flex:1;border-top:1.5px solid var(--rule)}
.book::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:2px;background:var(--margin);pointer-events:none}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:60px;padding:8px 12px 8px 38px;border-bottom:1.5px solid var(--rule);text-align:left}
.row .who{flex:1;min-width:0}
.name{font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--faint);margin-top:1px}
.amt{font-size:18px;font-weight:700;color:var(--owe);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.ok{color:var(--paid)}
.bags{font-size:13px;color:var(--muted);text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--orange-bg);color:var(--orange);margin-left:5px;vertical-align:2px}
.section{padding:12px 12px 4px 38px;font-size:14px;font-weight:700;color:var(--paid);border-bottom:1.5px solid var(--rule)}
.empty{padding:24px 16px 24px 38px;color:var(--muted)}
.empty h2{margin:0 0 4px;font-size:19px;color:var(--ink)}
.empty p{margin:0}
.strip{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:11px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:15px;text-align:left}
.strip span{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.searchrow{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-radius:12px;border:1.5px solid var(--ink)}
.searchrow input{flex:1;border:0;background:none;padding:10px 0;font-size:17px;color:var(--text);outline:none;min-width:0}
.bar{display:flex;gap:8px;align-items:center}
.big{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:14px;font-size:17px;font-weight:700;text-align:center;width:100%}
.primary{background:var(--btn);color:var(--on-btn)}
.green{background:var(--paid);color:var(--paper)}
.ghost{border:1.5px solid var(--line)}
.danger{background:var(--owe);color:var(--paper)}
.owes{text-align:center;padding:14px 12px 16px}
.owes .l{font-size:14px;color:var(--muted)}
.owes .n{font-size:38px;font-weight:700;color:var(--owe);font-variant-numeric:tabular-nums;line-height:1.1}
.owes .n.ok{color:var(--paid)}
.owes .b{font-size:15px;color:var(--muted)}
.hist-l{padding:4px 12px 6px 38px;font-size:13px;color:var(--faint)}
.hl{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:6px 12px 6px 38px;border-bottom:1.5px solid var(--rule);text-align:left;font-size:15px}
.hl .d{width:50px;flex:none;color:var(--faint);font-size:13px}
.hl .w{flex:1}
.hl .m{font-weight:700;font-variant-numeric:tabular-nums}
.hl .m.plus{color:var(--owe)}
.hl .m.minus{color:var(--paid)}
.hl.gone .w,.hl.gone .m{text-decoration:line-through;color:var(--faint)}
.minis{display:flex;gap:6px}
.mini{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:0 6px;border-radius:10px;background:var(--key);color:var(--ink);font-weight:700;font-size:13.5px;white-space:nowrap}
.minis .mini:first-child{flex:1.35}
.mini.warn{background:var(--orange-bg);color:var(--orange)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.acts.two .act{min-height:78px;font-size:17px}
.row{position:relative}
.mk{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:18px;display:flex;justify-content:center}
.mk.ok{color:var(--paid);font-size:17px;font-weight:700}
.mk.due{color:var(--warn)}
.total{padding:8px 12px 8px 38px;font-size:14px;color:var(--muted);border-bottom:1.5px solid var(--rule)}
.total b{color:var(--owe)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:68px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;font-weight:700;color:var(--ink)}
.act.took{background:var(--owe-bg);border-color:transparent;color:var(--owe)}
.act.pay{background:var(--paid-bg);border-color:transparent;color:var(--paid)}
.disp{padding:12px 14px;border-radius:16px;background:var(--key);text-align:right;font-variant-numeric:tabular-nums}
.disp .s{font-size:14px;color:var(--muted);min-height:19px}
.disp .v{font-size:36px;font-weight:700;line-height:1.15;word-break:break-all}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kp.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.key{min-height:52px;border-radius:12px;background:var(--key);color:var(--key-text);font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center}
.key.op{color:var(--ink)}
.key.eq{background:var(--btn);color:var(--on-btn)}
.span2{grid-column:span 2}
.key:active,.big:active,.act:active,.row:active,.mini:active,.tab:active{transform:scale(.97)}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper .key{width:66px;min-height:66px;font-size:32px;border-radius:50%}
.stepper .num{min-width:96px;text-align:center;font-size:46px;font-weight:700;color:var(--ink);line-height:1}
.stepper .unit{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:3px}
.halfbtn{align-self:center;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;color:var(--ink);font-size:15px}
.halfbtn.on{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.priceline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line)}
.priceline button{font-weight:700;color:var(--ink);padding:6px 10px;border-radius:8px;background:var(--key)}
.err{color:var(--owe);font-size:14px;min-height:19px;text-align:center}
.field{padding:6px 12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.field input,.phonebox{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:18px;text-align:left;min-height:50px;outline:none}
.field input:focus,.phonebox.on{border-color:var(--ink)}
.phonebox .ph{color:var(--faint)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.overlay{position:absolute;inset:0;background:rgba(5,8,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s ease-out}
.sheet{background:var(--sheet);width:100%;border-radius:22px 22px 0 0;padding:20px 14px 14px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto;animation:up .2s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet h3{margin:0;font-size:20px;color:var(--ink)}
.sheet p{margin:0;color:var(--muted);font-size:16px}
.sheet .res{font-size:28px;font-weight:700;color:var(--owe)}
.stamp{align-self:center;margin:4px 0;border:4px solid var(--paid);color:var(--paid);font-size:30px;font-weight:700;padding:2px 18px;border-radius:10px;transform:rotate(-6deg);letter-spacing:3px}
.note{font-size:13px;color:var(--faint);text-align:center;margin:0}
.crow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 38px;border-bottom:1.5px solid var(--rule)}
.crow .who{flex:1;min-width:0;text-align:left}
.pill{padding:10px 12px;border-radius:10px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:14px;white-space:nowrap}
.pill.off{background:var(--key);color:var(--faint)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.small{font-size:13px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.screen,.overlay,.sheet{animation:none}.key:active,.big:active,.act:active,.row:active,.mini:active,.tab:active{transform:none}}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px 9px 38px;border-bottom:1.5px solid var(--rule);font-size:14px;color:var(--muted)}
.topline b{color:var(--owe)}
.carbtn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--ink);padding:5px 9px;margin:-5px -9px;border-radius:9px}
.carbtn.low{color:var(--owe);background:var(--owe-bg)}
.carbtn.unset{color:var(--warn);background:var(--warn-bg)}
.row .rt{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.row .bg{font-size:15px;color:var(--muted)}
.ib.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stepper.sm .key{width:58px;min-height:58px;font-size:28px}
.stepper.sm .num{font-size:38px;min-width:84px}
.field .stepwrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calc{position:absolute;width:min(64%,260px);background:#FFFFFF;color:#1A1D26;border-radius:22px;padding:10px;box-shadow:0 12px 32px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.07);transform-origin:bottom right;z-index:15}
@keyframes pop{from{transform:scale(.45);opacity:0}}
.calc .lcd{background:#CBD5C3;border-radius:11px;padding:6px 10px 8px;text-align:right;font-variant-numeric:tabular-nums;color:#1E2A1B;margin-bottom:8px}
.calc .lcd .tp{font-size:12px;min-height:15px;opacity:.7}
.calc .lcd .vl{font-size:30px;font-weight:700;line-height:1.1;overflow:hidden;white-space:nowrap}
.calc .ks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.calc .k{min-height:48px;border-radius:11px;background:#F0F1F4;color:#1A1D26;font-size:22px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.calc .k:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.calc .k.op{background:#E2E6F3;color:#24307A}
.calc .k.eq{background:#24307A;color:#FFFFFF}
.calc .k.c{background:#FBE1E1;color:#BE2329}
.calc .use{display:block;width:100%;margin-top:7px;min-height:42px;border-radius:11px;background:#17703F;color:#FFFFFF;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:reduce){.calc{animation:none}}
.sub{flex:none;display:flex;flex-direction:column;gap:8px;padding:0 12px 6px}
.sub .topline{padding:2px 2px 0;border:0}
.dk.home{padding-bottom:20px}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--warn-bg)}100%{background:transparent}}
#dp .ncard{position:absolute;left:0;right:0;bottom:0;z-index:18;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:6px 14px 16px;display:flex;flex-direction:column;gap:10px;animation:up .2s ease-out}
#dp .ncard.still{animation:none}
.grab{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
.grab .gh{display:flex;align-items:center;justify-content:space-between;width:100%}
.grab .gh b{font-size:19px;color:var(--ink)}
.ncard input{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:19px;min-height:50px;outline:none}
.ncard input:focus{border-color:var(--ink)}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nrow .lbl{font-size:15px;color:var(--muted);min-width:44px}
.nstep{display:flex;align-items:center;gap:10px}
.nstep .key{width:50px;min-height:50px;border-radius:50%;font-size:26px}
.nstep .n{min-width:52px;text-align:center;font-size:30px;font-weight:700;color:var(--ink)}
.dbar{position:absolute;left:12px;right:12px;z-index:16;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.25);text-align:left;animation:pop .17s ease-out}
.dbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-top{display:flex;align-items:center;gap:8px}
.owes .who-n{font-size:15px;color:var(--muted);margin-bottom:2px}
.lbl2{padding:14px 12px 6px 38px;font-size:14px;font-weight:700;color:var(--muted)}
.load{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:8px 12px 8px 38px;border-bottom:1.5px solid var(--rule);text-align:left;font-size:16px;position:relative}
.load .d{width:50px;flex:none;color:var(--faint);font-size:13px}
.load .w{flex:1}
.load .w small{display:block;font-size:12px;color:var(--faint)}
.load .st{font-weight:700;color:var(--owe);white-space:nowrap}
.load.done .st{color:var(--paid)}
.load.done .w{color:var(--muted)}
.ib.call{background:var(--paid-bg);color:var(--paid)}
.ib.rem{background:var(--warn-bg);color:var(--warn)}
.pill.warn{background:var(--orange-bg);color:var(--orange)}
.ib.bellb{position:relative}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--owe);color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1}
.showbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;border-radius:999px;background:var(--key);color:var(--ink);font-weight:700;font-size:15px}
.owing-note{padding:10px 12px;border-radius:12px;background:var(--owe-bg);color:var(--owe);font-weight:700;font-size:15px;text-align:center}
.stmt{flex:1;display:flex;flex-direction:column;padding:8px 16px 16px}
.stmt .sn{font-size:22px;font-weight:700;color:var(--ink);text-align:center;margin-top:6px}
.stmt .st{font-size:15px;color:var(--muted);text-align:center}
.stmt .sv{font-size:44px;font-weight:700;color:var(--owe);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 14px}
.stmt .sl{display:flex;align-items:center;gap:10px;padding:14px 4px;border-bottom:1.5px solid var(--rule);font-size:18px}
.stmt .sl .d{width:64px;flex:none;color:var(--muted);font-size:16px}
.stmt .sl .w{flex:1}
.stmt .sl .w small{display:block;font-size:13px;color:var(--faint)}
.stmt .sl .a{font-weight:700;font-variant-numeric:tabular-nums}
.bd,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.bd::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.pagecard{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px 8px;padding:14px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);text-align:left;position:relative;overflow:hidden}
.pagecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--margin)}
.pagecard .pc-l{flex:1;min-width:0}
.pagecard .pc-l b{display:block;font-size:20px;color:var(--ink)}
.pagecard .pc-l span{font-size:13px;color:var(--faint)}
.pagecard .pc-r{text-align:right;white-space:nowrap}
.pagecard .pc-r b{display:block;font-size:18px;color:var(--owe)}
.pagecard .pc-r b.ok{color:var(--paid);font-size:15px}
.pagecard .pc-r span{font-size:12px;color:var(--faint)}
.pagecard:active{transform:scale(.98)}
.big{min-height:58px;font-size:18px}
.big.tall{min-height:72px;font-size:20px}

function similar(a,b){a=a.toLowerCase().replace(/\s+/g,'');b=b.toLowerCase().replace(/\s+/g,'');if(!a||!b)return false;if(a===b)return true;if(Math.min(a.length,b.length)<4)return false;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return false;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n]<=2;}

function pageOf(id){return(S.pages||[]).find(p=>p.id===id);}

/* loads: each time she took bags, cleared oldest first */
function loadsOf(pid){const u=undone();const es=entriesOf(pid);
 const loads=es.filter(e=>e.type==='took'&&!u.has(e.id)).map(e=>({id:e.id,pageId:e.pageId,date:e.date,bags:e.bags,price:e.price,amount:e.amount,backBags:0,backAmt:0}));
 const pays=[];es.forEach(e=>{if(u.has(e.id)||e.type==='undo')return;if(e.type==='paid')pays.push({amt:e.amount,pageId:e.pageId,loadId:e.loadId});else if(e.type==='back'){const L=loads.find(l=>l.id===e.ref);if(L){L.backBags+=e.bags;L.backAmt+=e.amount;}else pays.push({amt:e.amount,pageId:null});}});
 loads.forEach(L=>{L.left=Math.max(0,L.amount-L.backAmt);});
 pays.forEach(P=>{let r=P.amt;const first=loads.filter(L=>P.loadId&&L.id===P.loadId);const pageL=loads.filter(L=>!first.includes(L)&&P.pageId&&L.pageId===P.pageId);const order=first.concat(pageL,loads.filter(L=>!first.includes(L)&&!pageL.includes(L)));for(const L of order){if(r<=0)break;const c=Math.min(L.left,r);L.left=Math.round((L.left-c)*100)/100;r-=c;}});
 loads.forEach(L=>{L.bagsLeft=L.price?L.left/L.price:0;});
 return loads;}
function pageStats(pgid){const people=[];let out=0;S.people.forEach(p=>{const ls=loadsOf(p.id).filter(L=>L.pageId===pgid);if(!ls.length)return;const left=ls.reduce((a,L)=>a+L.left,0);out+=left;people.push(p);});return{people,out:Math.round(out*100)/100};}
function bagsOwed(pid,about){const t=loadsOf(pid).reduce((a,L)=>a+L.bagsLeft,0);if(t<=0.001)return'';const r=Math.round(t*2)/2;if(r===0)return'less than ½ '+U();return(about&&Math.abs(t-r)>=0.01?'about ':'')+bagsTxt(r);}

function phaseOf(pg){if(!pg)return'giving';const ph=pg.phase||(pg.done?'collecting':'giving');return ph==='reminding'?'waiting':ph;}
function collectOn(pg){const d=new Date(pg.date);d.setDate(d.getDate()+Number(S.settings.cycle||14));return d;}
function pageState(pg){const ph=phaseOf(pg);if(ph==='giving')return'giving';if(pageStats(pg.id).out<=0.001)return'done';if(ph==='collecting')return'collect';const dd=dayDiff(collectOn(pg));if(dd>=0)return'collect';if(dd===-1)return'remind';return'wait';}

function calcEval(tk){const t=tk.slice();while(t.length&&!/^\d/.test(t[t.length-1]))t.pop();if(!t.length)return 0;
 const terms=[];let cur=+t[0];for(let i=1;i<t.length;i+=2){const op=t[i],n=+t[i+1];if(op==='*')cur*=n;else{terms.push(cur);terms.push(op);cur=n;}}terms.push(cur);
 let r=terms[0];for(let i=1;i<terms.length;i+=2)r=terms[i]==='+'?r+terms[i+1]:r-terms[i+1];return Math.round(r*100)/100;}
function calcVal(){const c=V.calc;if(!c||!c.t)return 0;return calcEval(c.t);}

 const hasNum=c.t.some(x=>/^\d/.test(x));const res=calcVal();
 const k=(t,cls,lab)=>`<button class="k ${cls||''}" data-act="ck" data-k="${t}">${lab||t}</button>`;
 const fresh=!cp.firstChild;
 cp.innerHTML=`<div class="calc" role="dialog" aria-label="Calculator"><div class="lcd"><div class="tp" id="cexpr" style="font-size:${expr.length<=18?19:Math.max(13,19-(expr.length-18)*0.4)}px">${expr||'&nbsp;'}</div><div class="vl ${c.done?'done':''}">${c.done?'= ':''}${num(hasNum?res:0)}</div></div>
 <div class="ks">${k('7')}${k('8')}${k('9')}${k('*','op','×')}${k('4')}${k('5')}${k('6')}${k('-','op','−')}${k('1')}${k('2')}${k('3')}${k('+','op','+')}${k('C','c',c.t.length&&!c.done?'⌫':'AC')}${k('0')}${k('00')}${k('=','eq')}</div>
 ${V.view==='paid'?'<button class="use" data-act="usecalc">Use this number</button>':''}</div>`;
 const ex=document.getElementById('cexpr');if(ex)ex.scrollLeft=ex.scrollWidth;
 const el=cp.querySelector('.calc');const btn=app.querySelector('[data-act="calctoggle"]');const sh=document.getElementById('shell').getBoundingClientRect();
 if(btn){const r=btn.getBoundingClientRect();el.style.right=(sh.right-r.right)+'px';el.style.bottom=(sh.bottom-r.top+8)+'px';
  if(fresh&&!RM()&&el.animate){const cw=el.offsetWidth,ch=el.offsetHeight;el.animate([{transform:`translateY(${r.height+8}px) scale(${r.width/cw},${r.height/ch})`,opacity:.4,borderRadius:'12px'},{transform:'none',opacity:1,borderRadius:'22px'}],{duration:220,easing:'cubic-bezier(.2,.9,.25,1)'});}}
 else{const dk=app.querySelector('.dk');el.style.right='12px';el.style.bottom=((dk?dk.offsetHeight:0)+8)+'px';}

 if(!el||!btn||RM()||!el.animate){cp.innerHTML='';return;}const r=btn.getBoundingClientRect(),cw=el.offsetWidth,ch=el.offsetHeight;
 const a=el.animate([{transform:'none',opacity:1},{transform:`translateY(${r.height+8}px) scale(${r.width/cw},${r.height/ch})`,opacity:0}],{duration:170,easing:'ease-in'});a.onfinish=()=>{if(!V.calcOn)cp.innerHTML='';};}

function calcKey(t){if(!V.calc||!V.calc.t)V.calc={t:[],done:false};const c=V.calc;const isNum=x=>/^\d/.test(x||'');const last=c.t[c.t.length-1];
 if(/^\d+$/.test(t)){if(c.done){c.t=[];c.done=false;}const L=c.t[c.t.length-1];
  if(isNum(L)){let s=L==='0'?'':L;s=(s+t).replace(/^0+(?=\d)/,'');if(s.length<=10)c.t[c.t.length-1]=s||'0';}
  else c.t.push(t==='00'?'0':t);}
 else if(t==='C'){if(c.done||!c.t.length){c.t=[];c.done=false;}else if(isNum(last)){const s=last.slice(0,-1);if(s)c.t[c.t.length-1]=s;else c.t.pop();}else c.t.pop();}

function tone(f,t0,dur,type,vol){const c=ac();if(!c)return;const t=c.currentTime+t0;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.03);}
function sfx(kind){if(S.settings.sound===false)return;
 if(kind==='cash'){tone(1318,0,0.1,'triangle',0.16);tone(1760,0.07,0.32,'triangle',0.15);tone(2637,0.07,0.22,'sine',0.05);}
 else if(kind==='thud'){tone(95,0,0.2,'sine',0.35);tone(62,0.02,0.22,'sine',0.25);}
 else if(kind==='bag'){tone(165,0,0.11,'sine',0.25);tone(112,0.03,0.12,'sine',0.15);}
 else if(kind==='coin'){tone(1568,0,0.09,'triangle',0.13);tone(2093,0.05,0.16,'triangle',0.09);}
 else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.28,'triangle',0.15));tone(1568,0.46,0.5,'triangle',0.11);}}
function buzz(p){try{if(S.settings.sound!==false&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function coins(n,big){if(RM())return;const sh=document.getElementById('shell');const W=sh.offsetWidth,H=sh.offsetHeight;for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.textContent='₵';c.style.left=(W/2-14+(Math.random()-0.5)*W*(big?0.8:0.45))+'px';c.style.top=(H*(big?0.55:0.5))+'px';c.style.setProperty('--dx',((Math.random()-0.5)*170)+'px');c.style.setProperty('--dy',(-(180+Math.random()*(big?340:200)))+'px');c.style.setProperty('--r',((Math.random()-0.5)*720)+'deg');c.style.animationDelay=(Math.random()*0.15)+'s';sh.appendChild(c);setTimeout(()=>c.remove(),1500);}}
function countUp(el,to){if(!el||RM())return;const t0=performance.now(),d=550;const step=t=>{const k=Math.min(1,(t-t0)/d);const e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(step);else el.textContent=money(to);};requestAnimationFrame(step);}

 case'payload':V.payLoad=V.payLoad===d.id?null:d.id;return renderPaid();
 case'loadback':V.loadId=d.id;V.bags=1;return go('back');
 case'paid':V.kp='';V.combo=null;V.payLoad=null;V.collectFromPage=false;return go('paid');
 case'plus':V.bags=Math.min(999,V.bags+1);return render();
 case'minus':if(V.bags>=1.5)V.bags-=1;return render();
 case'half':V.bags=Math.abs(V.bags%1-0.5)<0.01?V.bags-0.5:V.bags+0.5;if(V.bags<0.5)V.bags=0.5;return render();
 case'chgprice':V.priceEdit=true;V.tmp='';return render();
 case'priceback':V.priceEdit=false;V.err='';return render();
 case'useprice':if(!(+V.tmp>0)){V.err='Type the price first.';return render();}V.tookPrice=+V.tmp;V.priceEdit=false;V.err='';return render();
 case'savetook':{const p=person(V.pid);const c=V.combo&&V.combo.ready?V.combo:null;const b=V.bags,pr=V.tookPrice,pgid=curPageId(),iid=V.tookItem;const stay=!!V.fromG;return carCheck(b,()=>{V.combo=null;V.fromG=false;giveTook(p,b,pr,c,stay,pgid,iid);},pgid,iid);}
 case'saveback':{const p=person(V.pid);const L=loadsOf(p.id).find(x=>x.id===V.loadId);if(!L)return go('person');const e=addEntry({pid:p.id,type:'back',ref:L.id,pageId:L.pageId,bags:V.bags,price:L.price,amount:Math.round(V.bags*L.price*100)/100});V.sheetBack='person';return doneSheet(`${esc(p.name)} brought back ${bagsTxt(V.bags)}`,e,msgBack(p,V.bags,balance(p.id)));}
 case'savepaid':{const a=+V.kp||0;if(!a){V.err='Type the money she gave first.';return renderPaid();}const p=person(V.pid);const selL=V.payLoad?loadsOf(p.id).find(L=>L.id===V.payLoad):null;const beforeOut={};(S.pages||[]).forEach(pg=>{beforeOut[pg.id]=pageStats(pg.id).out;});const e=addEntry({pid:p.id,type:'paid',pageId:selL?selL.pageId:(V.pageId||null),loadId:selL?selL.id:null,bags:0,price:0,amount:a});V.payLoad=null;V.combo={amount:a};closeCalc();V.combo={amount:a};const fromPage=V.pageId&&pageOf(V.pageId)&&pageOf(V.pageId).done&&V.view==='paid'&&V.collectFromPage;V.sheetBack=fromPage?'page':'person';tourNext(4);sfx('cash');buzz(25);const fully=balance(p.id)<=0.001;if(fully){V.lastStamp=p.id;setTimeout(()=>{sfx('thud');coins(14);},260);}const finished=(S.pages||[]).find(pg=>pg.done&&beforeOut[pg.id]>0.001&&pageStats(pg.id).out<=0.001);if(finished)setTimeout(()=>celebrate(finished),900);V.sheetBack='paid';V.kp='';const msg=selL?msgPaid(p,a,balance(p.id)).replace(` today, ${dmy(new Date())}. `,` today, ${dmy(new Date())}, for the ${dmy(selL.date)} bags. `):msgPaid(p,a,balance(p.id));renderPaid();return paidSheet(p,a,e,msg);}
 case'takemore':V.combo=V.combo||{amount:0};V.combo.ready=true;closeSheet();return act('took');
 case'calctoggle':{if(V.draftOpen)minimizeDraft();V.calcOn=!V.calcOn;const b=app.querySelector('[data-act="calctoggle"]');if(b){b.classList.toggle('on',V.calcOn);b.setAttribute('aria-pressed',String(V.calcOn));}if(!V.calcOn){shrinkCalc();return;}return renderCalcPop();}
 case'ck':return calcKey(d.k);
 case'usecalc':{const v=Math.round(calcVal()*100)/100;V.kp=v>0?String(v):'';closeCalc();return renderPaid();}
 case'key':return keyPress(d.k);
 case'saveprice':if(!(+V.tmp>0)){V.err="Type today's price first.";return renderPrice();}S.settings.price=+V.tmp;S.settings.priceDate=todayKey();save();if(V.next)return runNext();return go('home');
 case'samprice':S.settings.priceDate=todayKey();save();if(V.next)return runNext();return go('home');
 case'sheetdone':V.combo=null;V.holdEmpty=false;closeSheet();if(V.sheetBack==='paid'){V.kp='';return renderPaid();}return go(V.sheetBack||'person');
 case'carcount':return go('car');
 case'sheetclose':V.pending=null;return closeSheet();
 case'sent':setTimeout(()=>{V.holdEmpty=false;closeSheet();if(V.sheetBack==='paid'){V.kp='';renderPaid();return;}go(V.sheetBack||'person');},400);return;
 case'undolast':{V.holdEmpty=false;const r=S.entries.find(x=>x.id===d.id);if(r)addEntry({pid:r.pid,type:'undo',ref:r.id,bags:r.bags,price:r.price,amount:-sAmt(r)});closeSheet();if(V.sheetBack==='paid'){V.kp='';return renderPaid();}return go(V.sheetBack||'person');}
 case'line':{const e=S.entries.find(x=>x.id===d.id);if(!e||e.type==='undo'||undone().has(e.id))return;const w=e.type==='took'?'Took '+bagsTxt(e.bags):e.type==='paid'?'Paid '+money(e.amount):'Brought back '+bagsTxt(e.bags);
  openSheet(`<h3>Undo this?</h3><p>${dmy(e.date)}: ${w}</p><div class="bar"><button class="big ghost" data-act="sheetclose">Keep it</button><button class="big danger" data-act="undoline" data-id="${e.id}">Undo it</button></div>`);return;}
 case'undoline':{const r=S.entries.find(x=>x.id===d.id);if(r&&!undone().has(r.id))addEntry({pid:r.pid,type:'undo',ref:r.id,bags:r.bags,price:r.price,amount:-sAmt(r)});closeSheet();return render();}
 case'example':{if(V.demo)return go('home');V.realS=S;V.demo=true;const rs=V.realS.settings;S=blank();S.settings=Object.assign(S.settings,{seller:rs.seller,momo:rs.momo,unit:rs.unit||'bag',item:rs.item,sound:rs.sound});const epg=exampleData();S.place='all';V.pageId=epg.id;V.tour=1;V.askedEmpty=null;V.draft=null;closeCalc();return go('page');}
 case'leavedemo':{if(!V.demo)return;V.tour=0;S=V.realS;V.realS=null;V.demo=false;V.pageId=null;V.draft=null;V.draftOpen=false;dp.innerHTML='';closeCalc();closeSheet();const c=document.querySelector('.celebrate');if(c)c.remove();save();lastShown='';return go('home');}
 case'wipe':openSheet(`<h3>Delete everything?</h3><p>No undo.</p><div class="bar"><button class="big ghost" data-act="sheetclose">Keep</button><button class="big danger" data-act="wipeyes">Delete</button></div>`);return;
 case'wipeyes':S=blank();V.draft=null;save();return go('home');
 }
}
function keyPress(k){
 const v=V.view;
 const money7=s=>{if(k==='del')return s.slice(0,-1);if(k==='00'&&!s)return s;const n=(s+k).replace(/^0+/,'');return n.length>7?s:n;};
 const phone=s=>{if(k==='del')return s.slice(0,-1);if(s.length>=13)return s;return s+k;};
 const count=s=>{if(k==='del')return s.slice(0,-1);const n=(s+k).replace(/^0+(?=\d)/,'');return n.length>4?s:n;};
 V.err='';
 if(v==='paid'){V.kp=money7(V.kp);renderPaid();if(V.calcOn)renderCalcPop();return;}
 if(v==='price'){V.tmp=money7(V.tmp);return renderPrice();}
 if(v==='car'){V.tmp=count(V.tmp);return renderCar();}
 if(v==='newpage'){const W=V.wiz;const isMoney=W&&W.step===2&&(W.same||W.sub===2);V.tmp=isMoney?money7(V.tmp):count(V.tmp);return renderNewPage();}
 if(v==='took'&&V.priceEdit){V.tmp=money7(V.tmp);return render();}
 if(v==='phone'){V.tmp=phone(V.tmp);return renderPhone();}
}
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('overlay')){V.pending=null;closeSheet();if(['took','back','paid'].includes(V.view))go('person');return;}
 const b=e.target.closest('[data-act]');
 if(V.draft&&V.draftOpen&&!e.target.closest('.ncard')&&!e.target.closest('.overlay')){e.preventDefault();minimizeDraft();return;}
 if(V.calcOn&&!e.target.closest('.calc')&&!(b&&b.dataset.act==='calctoggle')&&!(b&&b.dataset.act==='key'))closeCalc();
 if(!b)return;
 if(b.tagName==='A'&&!['sent','rsent','hellosent'].includes(b.dataset.act))return;
 if(b.tagName!=='A')e.preventDefault();
 act(b.dataset.act,b.dataset);
});
(S.pages||[]).forEach(pg=>{if(pg.phase==='reminding')pg.phase='waiting';if(!pg.items){pg.items=[{id:'i1',name:'',count:Number(pg.bags)||0,price:S.settings.price}];}if(pg.done===undefined)pg.done=false;});
if(!S.pages){S.pages=[];if(S.entries.length){const first=S.entries.reduce((m,e)=>e.date<m?e.date:m,S.entries[0].date);const pg={id:uid(),date:first,bags:(S.car&&S.car.count)||0};S.pages.push(pg);S.entries.forEach(e=>{if(!e.pageId)e.pageId=pg.id;});}save();}
render();
</script>
